---
# Monitoring: kube-prometheus-stack (Prometheus + Grafana + Alertmanager) + ServiceMonitors
# Namespace: monitoring
#
# Voraussetzung: 40_platform.yml ausgeführt (cert-manager, Traefik, Cloudflare Tunnel laufen)
# Voraussetzung: all.sops.yml enthält grafana_admin_password + alertmanager_discord_webhook_url
#
# ⚠️  WICHTIG: Dieser Playbook beinhaltet einen Helm-Deploy mit wait_timeout: 20m.
#    SSH-Tunnel-Verbindungen brechen bei langen Wartezeiten ab.
#    → Entweder LAN-intern ausführen ODER SSH-Tunnel mit Keep-Alive starten:
#      ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -fN -L 6443:192.168.1.61:6443 raspi5
#    atomic: false — kein automatischer Rollback bei Timeout (verhindert pending-rollback Deadlock).
#
# Ausführen: ansible-playbook infra/playbooks/41_monitoring.yml
- name: Monitoring — kube-prometheus-stack + ServiceMonitors
  hosts: k3s_server
  gather_facts: false
  run_once: true
  vars:
    kubeconfig: "{{ lookup('env', 'HOME') }}/.kube/homelab.yaml"
    # coroot-node-agent spike gate (NM-2, #118): nodes listed here get the label
    # homelab.furchert.ch/coroot-node-agent=enabled, every other node loses it, and the
    # DaemonSet schedules only on labelled nodes. Empty = the DaemonSet exists but runs no pod.
    # This list is the source of truth: a run without it removes the label again. Override for
    # the spike with -e '{"coroot_node_agent_nodes": ["raspi5"]}'; persist the rollout by PR.
    # Runbook: DEPLOYMENT.md "coroot-node-agent (NM-2)".
    coroot_node_agent_nodes: []
    coroot_node_agent_label: homelab.furchert.ch/coroot-node-agent
    coroot_node_agent_dir: "{{ playbook_dir }}/../../cluster/monitoring/coroot-node-agent"

  tasks:
    - name: Prüfen dass alertmanager_discord_webhook_url gesetzt ist
      ansible.builtin.assert:
        that:
          - alertmanager_discord_webhook_url is defined
          - alertmanager_discord_webhook_url | length > 0
        fail_msg: >-
          alertmanager_discord_webhook_url ist nicht gesetzt.
          Bitte in infra/inventory/group_vars/all.sops.yml eintragen
          (Discord Server → Kanal-Einstellungen → Integrationen → Webhooks → URL kopieren).
      delegate_to: localhost

    - name: Monitoring Namespace anlegen
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: monitoring
      delegate_to: localhost

    - name: Prometheus-Community Helm Repo hinzufügen
      kubernetes.core.helm_repository:
        name: prometheus-community
        repo_url: https://prometheus-community.github.io/helm-charts
        binary_path: "{{ helm_binary }}"
      delegate_to: localhost

    - name: API erreichbar?
      ansible.builtin.command: >
        kubectl --kubeconfig {{ kubeconfig }} get --raw=/readyz
      delegate_to: localhost
      changed_when: false

    - name: Helm-Release Status ermitteln
      ansible.builtin.command: >
        {{ helm_binary }} status kube-prometheus-stack
        --namespace monitoring
        --kubeconfig {{ kubeconfig }}
        --output json
      delegate_to: localhost
      register: helm_release_status_raw
      changed_when: false
      failed_when: false

    - name: Helm-Release Status als Fact setzen
      ansible.builtin.set_fact:
        helm_release_status: "{{ (helm_release_status_raw.stdout | default('{}', true)) | from_json }}"

    # `helm rollback` on a release stuck in `pending-install` fails with
    # "no deployed releases" because there is no prior revision to roll back to.
    # Split the cleanup: rollback for pending-upgrade/pending-rollback,
    # uninstall for pending-install.
    - name: Stuck Helm-Release per rollback bereinigen (pending-upgrade / pending-rollback)
      ansible.builtin.command: >
        {{ helm_binary }} rollback kube-prometheus-stack
        --namespace monitoring
        --kubeconfig {{ kubeconfig }}
      delegate_to: localhost
      changed_when: true
      when:
        - helm_release_status.info is defined
        - helm_release_status.info.status in ['pending-upgrade', 'pending-rollback']

    - name: Stuck Helm-Release per uninstall bereinigen (pending-install)
      ansible.builtin.command: >
        {{ helm_binary }} uninstall kube-prometheus-stack
        --namespace monitoring
        --kubeconfig {{ kubeconfig }}
      delegate_to: localhost
      changed_when: true
      when:
        - helm_release_status.info is defined
        - helm_release_status.info.status == 'pending-install'

    - name: Kube-Prometheus-Stack deployen
      kubernetes.core.helm:
        name: kube-prometheus-stack
        chart_ref: prometheus-community/kube-prometheus-stack
        chart_version: "69.3.1"
        release_namespace: monitoring
        kubeconfig: "{{ kubeconfig }}"
        binary_path: "{{ helm_binary }}"
        values_files:
          - "{{ playbook_dir }}/../../cluster/values/kube-prometheus-stack.yaml"
        values:
          grafana:
            adminPassword: "{{ grafana_admin_password }}"
          alertmanager:
            config:
              global:
                resolve_timeout: 5m
              route:
                group_by: ['alertname', 'namespace']
                group_wait: 30s
                group_interval: 5m
                repeat_interval: 12h
                receiver: 'discord'
              receivers:
                - name: 'discord'
                  discord_configs:
                    - webhook_url: "{{ alertmanager_discord_webhook_url }}"
                      send_resolved: true
                - name: 'null'
              # Preserve kube-prometheus-stack default inhibit rules to avoid alert storms
              # during node failures (e.g. suppress symptom alerts when cause alert fires).
              inhibit_rules:
                - source_matchers:
                    - 'severity = critical'
                  target_matchers:
                    - 'severity =~ warning|info'
                  equal:
                    - 'namespace'
                    - 'alertname'
                - source_matchers:
                    - 'severity = warning'
                  target_matchers:
                    - 'severity = info'
                  equal:
                    - 'namespace'
                    - 'alertname'
                - source_matchers:
                    - 'alertname = InfoInhibitor'
                  target_matchers:
                    - 'severity = info'
                  equal:
                    - 'namespace'
        wait: true
        wait_timeout: "20m"
      no_log: true
      delegate_to: localhost

    # --- Prometheus PVC: opt out of the Longhorn default snapshot group (#101) ---
    # The `daily-snapshot` RecurringJob (30_longhorn.yml) covers every Longhorn
    # volume without a more specific recurring-job label. Prometheus' TSDB
    # rewrites blocks constantly, so its snapshot chain exceeded twice the
    # volume size and filled raspi4 (DiskPressure 2026-09-11). Labelling the
    # PVC as recurring-job "source" makes Longhorn sync the PVC's recurring-job
    # labels to the Volume, where they override the auto-added `default` label;
    # group `metrics` only carries the snapshot-cleanup job defined in 30.
    # The PVC is created by the Prometheus Operator after the Helm release is
    # up, hence the wait (60 × 10 s covers a fresh cluster). In --check mode on
    # a fresh cluster this wait times out after about 10 minutes (60 × 10 s) —
    # expected, not a hang; on a live cluster it resolves at once and the
    # patch below shows the label diff.
    # Removing this task does NOT remove the labels from the PVC; re-run this
    # playbook after any recreation of the PVC (restore, template change).
    - name: Prometheus PVC abwarten
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: v1
        kind: PersistentVolumeClaim
        namespace: monitoring
        name: prometheus-kube-prometheus-stack-prometheus-db-prometheus-kube-prometheus-stack-prometheus-0
      register: prometheus_pvc_info
      until: prometheus_pvc_info.resources | length > 0
      retries: 60
      delay: 10
      delegate_to: localhost

    - name: Prometheus PVC aus der Longhorn default-Snapshot-Gruppe nehmen
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: patched
        api_version: v1
        kind: PersistentVolumeClaim
        namespace: monitoring
        name: prometheus-kube-prometheus-stack-prometheus-db-prometheus-kube-prometheus-stack-prometheus-0
        definition:
          metadata:
            labels:
              recurring-job.longhorn.io/source: enabled
              recurring-job-group.longhorn.io/metrics: enabled
      delegate_to: localhost

    # --- ServiceMonitors ---
    # All ServiceMonitors live in the monitoring namespace with label release: kube-prometheus-stack
    # so the Prometheus Operator discovers them automatically.

    - name: Traefik ServiceMonitor anlegen
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: monitoring.coreos.com/v1
          kind: ServiceMonitor
          metadata:
            name: traefik
            namespace: monitoring
            labels:
              release: kube-prometheus-stack
          spec:
            endpoints:
              - port: metrics
                interval: 30s
            namespaceSelector:
              matchNames:
                - kube-system
            selector:
              matchLabels:
                app.kubernetes.io/name: traefik
      delegate_to: localhost

    # data-service (docs/060-network-monitoring.md §7.1, NM-1 #116): Spring Boot actuator
    # metrics on the Service port named `http` (8082), path /actuator/prometheus (served
    # without auth, no IP labels). Lives here — not in 50_apps_infra.yml — because
    # data-service is Flux-deployed (like traefik is not deployed by this playbook either)
    # and because the homelab-netmon alert rules that depend on this scrape (job
    # "data-service", incl. an absent() branch) are rolled out by the same run.
    - name: Data-service ServiceMonitor anlegen
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: monitoring.coreos.com/v1
          kind: ServiceMonitor
          metadata:
            name: data-service
            namespace: monitoring
            labels:
              release: kube-prometheus-stack
          spec:
            endpoints:
              - port: http
                path: /actuator/prometheus
                interval: 30s
            namespaceSelector:
              matchNames:
                - apps
            selector:
              matchLabels:
                app: data-service
      delegate_to: localhost

    # --- coroot-node-agent (NM-2, #118; docs/060-network-monitoring.md §6) ---
    # Plain manifests in cluster/monitoring/coroot-node-agent/, applied file by file like the
    # Ansible-managed apps (52/53/54). Its alert rules live in
    # cluster/values/kube-prometheus-stack.yaml (additionalPrometheusRulesMap.homelab-netmon-egress)
    # and ship with the Helm release above. Runs after the Helm release because the
    # ServiceMonitor CRD comes with kube-prometheus-stack.
    - name: Coroot-node-agent — read cluster nodes
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: v1
        kind: Node
      register: coroot_node_agent_node_info
      delegate_to: localhost

    - name: Coroot-node-agent — assert the gate list names existing nodes
      ansible.builtin.assert:
        that:
          - coroot_node_agent_nodes | difference(coroot_node_agent_node_info.resources | map(attribute='metadata.name') | list) | length == 0
        fail_msg: >-
          coroot_node_agent_nodes contains unknown node(s):
          {{ coroot_node_agent_nodes | difference(coroot_node_agent_node_info.resources | map(attribute='metadata.name') | list) }}
      delegate_to: localhost

    - name: Coroot-node-agent — label gated nodes
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: patched
        api_version: v1
        kind: Node
        name: "{{ item.metadata.name }}"
        definition:
          metadata:
            labels:
              # literal key (must equal coroot_node_agent_label and the DaemonSet nodeSelector)
              homelab.furchert.ch/coroot-node-agent: "enabled"
      loop: "{{ coroot_node_agent_node_info.resources }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      when:
        - item.metadata.name in coroot_node_agent_nodes
        - (item.metadata.labels | default({}))[coroot_node_agent_label] | default('') != 'enabled'
      delegate_to: localhost

    - name: Coroot-node-agent — remove the label from nodes outside the gate list
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: patched
        api_version: v1
        kind: Node
        name: "{{ item.metadata.name }}"
        definition:
          metadata:
            labels:
              # null = strategic-merge delete of the label
              homelab.furchert.ch/coroot-node-agent: null
      loop: "{{ coroot_node_agent_node_info.resources }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      when:
        - item.metadata.name not in coroot_node_agent_nodes
        - coroot_node_agent_label in (item.metadata.labels | default({}))
      delegate_to: localhost

    - name: Coroot-node-agent — apply manifests
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        src: "{{ coroot_node_agent_dir }}/{{ item }}"
      loop:
        - networkpolicy.yaml
        - service.yaml
        - servicemonitor.yaml
        - daemonset.yaml
      delegate_to: localhost
