---
# App Infrastructure: PostgreSQL 17, InfluxDB 2, Mosquitto 2
# Namespace: apps
#
# Voraussetzung: 30_longhorn.yml ausgeführt (Longhorn Default StorageClass)
# Voraussetzung: all.sops.yml enthält postgresql_password, postgresql_replication_password,
#                influxdb_admin_password, influxdb_admin_token
#
# Mosquitto broker authentication (homelab#122 phase 1), SOPS variables:
#   device_service_mqtt_password:     <openssl rand -base64 32>  broker user `backend`; 59 writes the
#                                     same value to device-service-secrets/mqtt-password
#   mosquitto_exporter_mqtt_password: <openssl rand -base64 32>  broker user `exporter` ($SYS read-only)
#   mosquitto_homeassistant_mqtt_password: optional, only if Home Assistant's MQTT integration is used
#   Each at least 24 characters, single line. Rotation order: vault -> 50 -> 59 ->
#   kubectl -n apps delete pod -l app=device-service (DEPLOYMENT.md "Mosquitto broker access").
#   Rollback to anonymous access: -e mqtt_auth_enabled=false
#
# Ausführen: ansible-playbook infra/playbooks/50_apps_infra.yml
- name: App Infrastructure — PostgreSQL, InfluxDB 2, Mosquitto
  hosts: k3s_server
  gather_facts: false
  run_once: true
  vars:
    kubeconfig: "{{ lookup('env', 'HOME') }}/.kube/homelab.yaml"
    apps_namespace: apps
    # Size of the PostgreSQL volume (volumeClaimTemplates). 5Gi until 2026-11-09, then expanded in place to
    # 10Gi (homelab#359, web analytics capacity). volumeClaimTemplates are immutable: never change this
    # value on a live cluster without the runbook DEPLOYMENT.md "Growing the PostgreSQL volume"; the
    # drift check before the expansion runs with -e postgresql_storage_size=5Gi.
    postgresql_storage_size: 10Gi
    # Mosquitto broker authentication (homelab#122 phase 1). false = anonymous broker (rollback).
    mqtt_auth_enabled: true
    # Broker ACL (Mosquitto acl_file syntax). `backend` = device-service, `exporter` = mosquitto-exporter.
    # The two pattern lines give every user its own `<username>/#` (read/write) plus read on
    # terraGeneral/#: the device contract of spec 053 (devices are broker users named like their
    # device id). `backend` and `exporter` also get an unused `<username>/#`.
    mosquitto_acl: |
      user backend
      topic read terra1/#
      topic read terra2/#
      topic readwrite terraGeneral/#
      topic write +/+/man
      topic readwrite javaBackend/mqtt/status

      user exporter
      topic read $SYS/#

      pattern readwrite %u/#
      pattern read terraGeneral/#
    mosquitto_conf: |
      listener 1883
      {% if mqtt_auth_enabled | bool %}
      allow_anonymous false
      password_file /mosquitto/auth/passwd
      acl_file /mosquitto/auth/acl
      {% else %}
      # Rollback mode (mqtt_auth_enabled=false): anonymous access. Do NOT expose port 1883 outside the
      # cluster in this mode.
      allow_anonymous true
      {% endif %}
      persistence true
      persistence_location /mosquitto/data/
      log_dest stdout
      log_type error warning notice information

  pre_tasks:
    - name: Check that helm_binary is Helm 3 (#36)
      ansible.builtin.import_tasks: tasks/helm-v3-preflight.yml
      tags: [always]

  tasks:
    # --- Namespace ---
    - name: Apps Namespace anlegen
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ apps_namespace }}"
            # Pod Security Admission #160, step 1: warn + audit only, nothing enforced (DEPLOYMENT.md
            # "Pod Security Admission"). The label-less apps Namespace tasks in 52-55 keep these labels (merge
            # patch). Bump the -version labels with the next k3s minor.
            labels:
              pod-security.kubernetes.io/warn: baseline
              pod-security.kubernetes.io/warn-version: v1.32
              pod-security.kubernetes.io/audit: baseline
              pod-security.kubernetes.io/audit-version: v1.32
      delegate_to: localhost

    - name: Prüfen dass sentry_dsn gesetzt ist
      ansible.builtin.assert:
        that:
          - sentry_dsn is defined
          - sentry_dsn | length > 0
        fail_msg: >-
          sentry_dsn ist nicht gesetzt.
          Bitte in infra/inventory/group_vars/all.sops.yml eintragen
          (Sentry → Project Settings → Client Keys → DSN).
      delegate_to: localhost

    # --- Sentry ---
    - name: Sentry DSN Secret anlegen
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: sentry-dsn
            namespace: "{{ apps_namespace }}"
          type: Opaque
          stringData:
            dsn: "{{ sentry_dsn }}"
      no_log: true
      delegate_to: localhost

    # --- PostgreSQL ---
    # Hinweis: bitnami/postgresql chart nicht verwendet — Image docker.io/bitnami/postgresql
    # ist auf Docker Hub nicht mehr verfügbar (seit Bitnami Registry-Wechsel 2024).
    # Stattdessen: offizielles postgres:17-alpine Image via raw Manifests.

    - name: PostgreSQL Secret anlegen
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: postgresql-secret
            namespace: "{{ apps_namespace }}"
          type: Opaque
          stringData:
            POSTGRES_PASSWORD: "{{ postgresql_password }}"
      no_log: true
      delegate_to: localhost

    # No `--save-config` annotation is needed after the live-object re-create of the volume expansion
    # (runbook step S) while this task uses a strategic-merge patch; revisit if it switches to apply or
    # server-side apply.
    - name: PostgreSQL StatefulSet anlegen
      tags: [postgresql-statefulset]
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: postgresql
            namespace: "{{ apps_namespace }}"
          spec:
            serviceName: postgresql
            replicas: 1
            selector:
              matchLabels:
                app: postgresql
            template:
              metadata:
                labels:
                  app: postgresql
              spec:
                containers:
                  - name: postgresql
                    # pgvector 0.8.6-pg17 (2026-08-13, PostgreSQL 17.11): bug-fix release; extension objects
                    # stay at the installed version until ALTER EXTENSION vector UPDATE is run per database
                    # (club_assistant only). Multi-arch index digest resolved 2026-09-04 via
                    # `docker buildx imagetools inspect` (#57).
                    image: pgvector/pgvector:0.8.6-pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
                    env:
                      - name: POSTGRES_PASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: postgresql-secret
                            key: POSTGRES_PASSWORD
                      - name: POSTGRES_DB
                        value: postgres
                      - name: PGDATA
                        value: /var/lib/postgresql/data/pgdata
                    ports:
                      - containerPort: 5432
                    volumeMounts:
                      - name: data
                        mountPath: /var/lib/postgresql/data
                    resources:
                      requests:
                        cpu: 100m
                        # memory request doubled alongside the limit below to preserve
                        # the existing 1:2 request:limit ratio (unchanged convention).
                        memory: 512Mi
                      limits:
                        cpu: 500m
                        # Raised 512Mi -> 1Gi: 2026-07-08 OOMKill of postgresql-0 under
                        # club-assistant pgvector bulk-insert load (HNSW index maintenance
                        # + large statements during the Drive corpus backfill). Vector
                        # workloads keep growing with the club-assistant roadmap (chunks
                        # corpus ~20k+ rows now, facts/embeddings in Phase 2).
                        # See club-assistant worklog 20260708-121500-phase1-drive-backfill-c5f8.
                        memory: 1Gi
                  - name: postgres-exporter
                    # postgres-exporter v0.20.1 (2026-07-08): supports PG17 pg_stat_checkpointer (fixes
                    # 'column "checkpoints_timed" does not exist'); v0.20.0 flag/metric renames
                    # (replication_slot*) do not affect this config (no flags set). Multi-arch
                    # index digest resolved 2026-09-04 via `docker buildx imagetools inspect` (#57).
                    image: prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
                    env:
                      - name: DATA_SOURCE_URI
                        value: "localhost:5432/postgres?sslmode=disable"
                      - name: DATA_SOURCE_USER
                        value: "postgres"
                      - name: DATA_SOURCE_PASS
                        valueFrom:
                          secretKeyRef:
                            name: postgresql-secret
                            key: POSTGRES_PASSWORD
                    ports:
                      - containerPort: 9187
                    resources:
                      requests:
                        cpu: 10m
                        memory: 32Mi
                      limits:
                        # Raised 100m -> 250m (#68): scrape bursts throttled 67% of CFS periods
                        # over 24h at 100m against ~2m-cores average usage (CPUThrottlingHigh);
                        # requests unchanged (CFS throttling is enforced against the limit, not
                        # the request; average usage stays far below the unchanged 10m request).
                        cpu: 250m
                        memory: 64Mi
            volumeClaimTemplates:
              - metadata:
                  name: data
                spec:
                  accessModes: [ReadWriteOnce]
                  storageClassName: longhorn
                  resources:
                    requests:
                      storage: "{{ postgresql_storage_size }}"
      delegate_to: localhost

    - name: PostgreSQL Service anlegen
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: postgresql
            namespace: "{{ apps_namespace }}"
            labels:
              app: postgresql
          spec:
            type: ClusterIP
            selector:
              app: postgresql
            ports:
              - name: postgresql
                port: 5432
                targetPort: 5432
              - name: metrics
                port: 9187
                targetPort: 9187
      delegate_to: localhost

    # --- InfluxDB 2 ---
    - name: InfluxData Helm Repo hinzufügen
      kubernetes.core.helm_repository:
        name: influxdata
        repo_url: https://helm.influxdata.com/
        binary_path: "{{ helm_binary }}"
      delegate_to: localhost

    - name: InfluxDB 2 deployen
      kubernetes.core.helm:
        name: influxdb2
        chart_ref: influxdata/influxdb2
        chart_version: "2.1.2"
        release_namespace: "{{ apps_namespace }}"
        kubeconfig: "{{ kubeconfig }}"
        binary_path: "{{ helm_binary }}"
        values_files:
          - "{{ playbook_dir }}/../../cluster/values/influxdb2.yaml"
        values:
          adminUser:
            password: "{{ influxdb_admin_password }}"
            token: "{{ influxdb_admin_token }}"
        wait: true
        wait_timeout: "5m"
      no_log: true
      delegate_to: localhost

    # --- Mosquitto (raw manifests — kein Helm, k8s-at-home chart archiviert) ---
    # Broker authentication (homelab#122 phase 1): password_file with $7$ (PBKDF2-SHA512) hashes and an
    # acl_file, on the official image (no plugin). The hashes are computed on the controller by
    # files/mosquitto-passwd.py (password on stdin, never in argv) with a salt derived from user and
    # password, so a second run renders the same Secret.
    - name: Mosquitto auth — assert that the broker passwords are set (homelab#122)
      ansible.builtin.assert:
        that:
          - device_service_mqtt_password is defined
          - device_service_mqtt_password is string
          - device_service_mqtt_password | length >= 24
          - device_service_mqtt_password is not search('[\r\n]')
          - mosquitto_exporter_mqtt_password is defined
          - mosquitto_exporter_mqtt_password is string
          - mosquitto_exporter_mqtt_password | length >= 24
          - mosquitto_exporter_mqtt_password is not search('[\r\n]')
          - mosquitto_exporter_mqtt_password != device_service_mqtt_password
          - >-
            mosquitto_homeassistant_mqtt_password is not defined or
            (mosquitto_homeassistant_mqtt_password is string and
             mosquitto_homeassistant_mqtt_password | length >= 24 and
             mosquitto_homeassistant_mqtt_password is not search('[\r\n]'))
        fail_msg: >-
          Mosquitto broker authentication needs device_service_mqtt_password and
          mosquitto_exporter_mqtt_password in the SOPS inventory: different values, at least 24
          characters, single line (e.g. openssl rand -base64 32). mosquitto_homeassistant_mqtt_password
          is optional with the same rules. See the header comment of this playbook; rollback:
          -e mqtt_auth_enabled=false.
        quiet: true
      when: mqtt_auth_enabled | bool
      delegate_to: localhost

    - name: Mosquitto auth — broker users
      ansible.builtin.set_fact:
        mosquitto_auth_users: >-
          {{ [{'name': 'backend', 'password': device_service_mqtt_password},
              {'name': 'exporter', 'password': mosquitto_exporter_mqtt_password}]
             + ([{'name': 'homeassistant', 'password': mosquitto_homeassistant_mqtt_password}]
                if mosquitto_homeassistant_mqtt_password is defined else []) }}
      no_log: true
      when: mqtt_auth_enabled | bool

    - name: Mosquitto auth — render the password file ($7$ hashes on the controller)
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "-I"
          - "{{ playbook_dir }}/files/mosquitto-passwd.py"
        stdin: "{{ mosquitto_auth_users | to_json }}"
      register: mosquitto_passwd_render
      changed_when: false
      check_mode: false
      no_log: true
      when: mqtt_auth_enabled | bool
      delegate_to: localhost

    - name: Mosquitto auth — password file Secret
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: mosquitto-auth
            namespace: "{{ apps_namespace }}"
          type: Opaque
          stringData:
            passwd: "{{ mosquitto_passwd_render.stdout }}\n"
      no_log: true
      when: mqtt_auth_enabled | bool
      delegate_to: localhost

    - name: Mosquitto auth — ACL ConfigMap
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: mosquitto-acl
            namespace: "{{ apps_namespace }}"
          data:
            acl: "{{ mosquitto_acl }}"
      when: mqtt_auth_enabled | bool
      delegate_to: localhost

    - name: Mosquitto auth — exporter credentials Secret
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: mosquitto-exporter-mqtt
            namespace: "{{ apps_namespace }}"
          type: Opaque
          stringData:
            username: exporter
            password: "{{ mosquitto_exporter_mqtt_password }}"
      no_log: true
      when: mqtt_auth_enabled | bool
      delegate_to: localhost

    - name: Mosquitto ConfigMap anlegen
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: mosquitto-config
            namespace: "{{ apps_namespace }}"
          data:
            mosquitto.conf: "{{ mosquitto_conf }}"
      delegate_to: localhost

    - name: Mosquitto PVC anlegen
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: mosquitto-data
            namespace: "{{ apps_namespace }}"
          spec:
            accessModes: [ReadWriteOnce]
            storageClassName: longhorn  # Explicit — fragile against k3s upgrade resetting local-path as default
            resources:
              requests:
                storage: 1Gi
      delegate_to: localhost

    - name: Mosquitto Deployment anlegen
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: mosquitto
            namespace: "{{ apps_namespace }}"
          spec:
            replicas: 1
            strategy:
              type: Recreate  # RWO PVC — must terminate old pod before new one mounts the volume
            selector:
              matchLabels:
                app: mosquitto
            template:
              metadata:
                labels:
                  app: mosquitto
                annotations:
                  # The broker reads its config, password and ACL files only at start: a change in any
                  # of them rolls the pod. The password part hashes the $7$ lines, not plaintext.
                  checksum/config: >-
                    {{ (mosquitto_conf ~ (mosquitto_passwd_render.stdout | default(''))
                        ~ (mosquitto_acl if mqtt_auth_enabled | bool else '')) | hash('sha256') }}
              spec:
                # Mosquitto drops to uid/gid 1883 after reading mosquitto.conf and opens the password and
                # ACL files as that user: the projected files are root:1883, mode 0440.
                securityContext:
                  fsGroup: 1883
                  fsGroupChangePolicy: OnRootMismatch
                containers:
                  - name: mosquitto
                    # Pinned 2.1.2-alpine (2026-06-22). The bare tag 2.1.2 does not exist on
                    # Docker Hub (docker-library official-images manifest). Persistence format
                    # identical (MOSQ_DB_VERSION=6 in 2.0.22 and 2.1.2), same Alpine base; none
                    # of our config directives are deprecated in 2.1. max_packet_size default is
                    # now 2 MB. Multi-arch index digest resolved 2026-09-04 via
                    # `docker buildx imagetools inspect` (#57).
                    image: "eclipse-mosquitto:2.1.2-alpine@sha256:6f8d8a947c506f8a2290ec65cd4bd2bc7cb4d43fb5f6271f861cb013e2ef9797"
                    ports:
                      - containerPort: 1883
                    volumeMounts:
                      - name: config
                        mountPath: /mosquitto/config
                      - name: auth
                        mountPath: /mosquitto/auth
                        readOnly: true
                      - name: data
                        mountPath: /mosquitto/data
                    resources:
                      requests:
                        cpu: 50m
                        memory: 64Mi
                      limits:
                        cpu: 200m
                        memory: 128Mi
                volumes:
                  - name: config
                    configMap:
                      name: mosquitto-config
                  # Password file (Secret mosquitto-auth) and ACL (ConfigMap mosquitto-acl) in one
                  # directory. optional: the pod also starts in rollback mode, where the config does
                  # not reference these files and the objects may not exist yet.
                  - name: auth
                    projected:
                      defaultMode: 0440
                      sources:
                        - secret:
                            name: mosquitto-auth
                            optional: true
                            items:
                              - key: passwd
                                path: passwd
                        - configMap:
                            name: mosquitto-acl
                            optional: true
                            items:
                              - key: acl
                                path: acl
                  - name: data
                    persistentVolumeClaim:
                      claimName: mosquitto-data
      delegate_to: localhost

    - name: Mosquitto Service anlegen
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: mosquitto
            namespace: "{{ apps_namespace }}"
          spec:
            # ClusterIP by default (homelab#122 phase 0): the broker is reachable only from
            # inside the cluster (device-service, mosquitto-exporter, Home Assistant via
            # cluster DNS). Rollback: -e mosquitto_service_type=LoadBalancer. If the API
            # server rejects the in-place type change, delete the Service once
            # (kubectl -n apps delete svc mosquitto) and re-run this playbook.
            type: "{{ mosquitto_service_type | default('ClusterIP') }}"
            selector:
              app: mosquitto
            ports:
              - name: mqtt
                port: 1883
                targetPort: 1883
                protocol: TCP
      delegate_to: localhost

    # --- Mosquitto Exporter ---
    - name: Mosquitto Exporter Deployment anlegen
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: mosquitto-exporter
            namespace: "{{ apps_namespace }}"
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: mosquitto-exporter
            template:
              metadata:
                labels:
                  app: mosquitto-exporter
                annotations:
                  # Env is read only at start: roll the exporter when a broker password changes.
                  checksum/credentials: "{{ (mosquitto_passwd_render.stdout | default('')) | hash('sha256') }}"
              spec:
                containers:
                  - name: mosquitto-exporter
                    # Multi-arch (amd64+arm/v7+arm64) index digest resolved 2026-09-04 via
                    # `docker buildx imagetools inspect` (#57).
                    image: "nolte/mosquitto-exporter:v0.6.3@sha256:0f6048dbb36ed328b57f890d9a3b430374008db2c3b3a30c5e3ec268a36adf83"
                    args:
                      - "--endpoint"
                      - "tcp://mosquitto.{{ apps_namespace }}.svc.cluster.local:1883"
                    # Broker user `exporter` ($SYS read-only, homelab#122). optional: in rollback mode
                    # without the Secret the exporter connects anonymously.
                    env:
                      - name: MQTT_USER
                        valueFrom:
                          secretKeyRef:
                            name: mosquitto-exporter-mqtt
                            key: username
                            optional: true
                      - name: MQTT_PASS
                        valueFrom:
                          secretKeyRef:
                            name: mosquitto-exporter-mqtt
                            key: password
                            optional: true
                    ports:
                      - containerPort: 9234
                    resources:
                      requests:
                        cpu: 10m
                        memory: 16Mi
                      limits:
                        cpu: 50m
                        memory: 32Mi
      delegate_to: localhost

    - name: Mosquitto Exporter Service anlegen
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: mosquitto-metrics
            namespace: "{{ apps_namespace }}"
            labels:
              app: mosquitto-exporter
          spec:
            type: ClusterIP
            selector:
              app: mosquitto-exporter
            ports:
              - name: metrics
                port: 9234
                targetPort: 9234
      delegate_to: localhost

    # --- Prometheus ServiceMonitors ---
    # Vorbedingung: 41_monitoring.yml muss ausgeführt worden sein (Prometheus Operator CRDs)
    - name: Prüfen ob Prometheus Operator CRD (ServiceMonitor) installiert ist
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: servicemonitors.monitoring.coreos.com
      delegate_to: localhost
      register: servicemonitor_crd

    - name: Abbrechen wenn Prometheus Operator CRD fehlt
      ansible.builtin.assert:
        that: servicemonitor_crd.resources | length > 0
        fail_msg: >
          ServiceMonitor CRD nicht gefunden. Bitte zuerst 41_monitoring.yml ausführen:
          ansible-playbook infra/playbooks/41_monitoring.yml

    - name: PostgreSQL ServiceMonitor anlegen
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: monitoring.coreos.com/v1
          kind: ServiceMonitor
          metadata:
            name: postgresql
            namespace: monitoring
            labels:
              release: kube-prometheus-stack
          spec:
            endpoints:
              - port: metrics
                interval: 30s
            namespaceSelector:
              matchNames:
                - "{{ apps_namespace }}"
            selector:
              matchLabels:
                app: postgresql
      delegate_to: localhost

    - name: InfluxDB ServiceMonitor anlegen
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: monitoring.coreos.com/v1
          kind: ServiceMonitor
          metadata:
            name: influxdb2
            namespace: monitoring
            labels:
              release: kube-prometheus-stack
          spec:
            endpoints:
              - port: http
                path: /metrics
                interval: 30s
            namespaceSelector:
              matchNames:
                - "{{ apps_namespace }}"
            selector:
              matchLabels:
                app.kubernetes.io/instance: influxdb2
      delegate_to: localhost

    - name: Mosquitto ServiceMonitor anlegen
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: monitoring.coreos.com/v1
          kind: ServiceMonitor
          metadata:
            name: mosquitto
            namespace: monitoring
            labels:
              release: kube-prometheus-stack
          spec:
            endpoints:
              - port: metrics
                interval: 30s
            namespaceSelector:
              matchNames:
                - "{{ apps_namespace }}"
            selector:
              matchLabels:
                app: mosquitto-exporter
      delegate_to: localhost
