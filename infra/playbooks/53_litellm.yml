---
# LiteLLM AI Gateway deployment
# Namespace: apps
# Public endpoint: https://ai.furchert.ch (via Cloudflare Tunnel — configured in 40_platform.yml)
#
# Prerequisites:
#   - 50_apps_infra.yml completed (apps namespace + PostgreSQL running)
#   - 59_app_services.yml completed (litellm-secrets + litellm Postgres DB created)
#   - all.sops.yml contains: litellm_master_key, litellm_salt_key, litellm_db_password,
#                             mistral_api_key, mistral_codestral_api_key, litellm_client_secret
#
# Run order:
#   1. ansible-playbook infra/playbooks/59_app_services.yml   # secrets + DB
#   2. ansible-playbook infra/playbooks/53_litellm.yml        # this file
#   3. ansible-playbook infra/playbooks/40_platform.yml       # CF Tunnel ingress
#
# Idempotent: running twice produces zero changes on second run.
# ConfigMap hash annotation: Deployment restarts automatically when configmap.yaml changes.
#
# Run: ansible-playbook infra/playbooks/53_litellm.yml

- name: App Deployment — LiteLLM AI Gateway
  hosts: k3s_server
  gather_facts: false
  run_once: true
  vars:
    kubeconfig: "{{ lookup('env', 'HOME') }}/.kube/homelab.yaml"
    apps_namespace: apps

  tasks:
    # Config-change guard: club routing changes have been applied from feature branches, so the live
    # ConfigMap can be ahead of this checkout — a run from an older tree would silently revert it.
    # A run whose config.yaml differs from the live one fails unless the operator acknowledges the
    # exact new content by its sha256 (printed in the failure message; DEPLOYMENT.md "LiteLLM"):
    #   ansible-playbook infra/playbooks/53_litellm.yml -e litellm_config_change_ack=<sha256>
    # Pass the ack on the command line only — never put it into inventory/group_vars. A k8s_info error
    # fails the play (fail-closed); only a successful lookup without a ConfigMap counts as "not deployed".
    # The ConfigMap holds only os.environ/ references, no key material; the message prints hashes only.
    - name: LiteLLM Live-ConfigMap lesen (Config-Guard)
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: ConfigMap
        namespace: "{{ apps_namespace }}"
        name: litellm-config
      register: litellm_live_configmap
      no_log: true
      delegate_to: localhost

    - name: LiteLLM Config-Wechsel nur mit Bestätigung (Config-Guard)
      vars:
        litellm_manifest_config_sha256: >-
          {{ ((lookup('file', playbook_dir + '/../../cluster/apps/litellm/configmap.yaml', rstrip=False) | from_yaml)
              .data['config.yaml'] | default('')) | hash('sha256') }}
        litellm_live_config_sha256: >-
          {{ ((litellm_live_configmap.resources[0].data | default({}))['config.yaml'] | default('')) | hash('sha256')
             if litellm_live_configmap.resources | length > 0 else litellm_manifest_config_sha256 }}
      ansible.builtin.assert:
        that:
          - litellm_manifest_config_sha256 != ('' | hash('sha256'))
          - litellm_live_config_sha256 == litellm_manifest_config_sha256 or
            (litellm_config_change_ack | default('')) == litellm_manifest_config_sha256
        fail_msg: >-
          LiteLLM config change live sha256 {{ litellm_live_config_sha256 }} -> checkout sha256
          {{ litellm_manifest_config_sha256 }} is not acknowledged. Check that this checkout contains every
          change that is live (diff the live ConfigMap first, DEPLOYMENT.md "LiteLLM"), then re-run with
          -e litellm_config_change_ack={{ litellm_manifest_config_sha256 }}
        quiet: true
      delegate_to: localhost

    - name: Apps Namespace sicherstellen
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ apps_namespace }}"
      delegate_to: localhost

    # ConfigMap must be applied BEFORE Deployment — Deployment mounts it as a volume.
    # Applying them out of order causes pod failure: "configmap litellm-config not found".
    - name: LiteLLM ConfigMap anlegen (model routing config)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        src: "{{ playbook_dir }}/../../cluster/apps/litellm/configmap.yaml"
      delegate_to: localhost

    - name: LiteLLM Deployment anlegen
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        src: "{{ playbook_dir }}/../../cluster/apps/litellm/deployment.yaml"
      delegate_to: localhost

    - name: LiteLLM Service anlegen
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        src: "{{ playbook_dir }}/../../cluster/apps/litellm/service.yaml"
      delegate_to: localhost

    # Restart Deployment when configmap.yaml changes — same hash-annotation pattern as cloudflared.
    # The annotation on spec.template.metadata triggers a rolling restart when the hash changes.
    - name: LiteLLM ConfigMap-Hash setzen (automatischer Restart bei Config-Änderung)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        kind: Deployment
        name: litellm
        namespace: "{{ apps_namespace }}"
        definition:
          spec:
            template:
              metadata:
                annotations:
                  homelab.furchert.ch/config-hash: >-
                    {{ lookup('file', playbook_dir + '/../../cluster/apps/litellm/configmap.yaml') | hash('sha256') }}
      delegate_to: localhost

    - name: LiteLLM Rollout warten (bis zu 600s — erste Ausführung startet Datenbankmigrationen)
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: Deployment
        name: litellm
        namespace: "{{ apps_namespace }}"
      register: litellm_deploy_info
      until: >
        litellm_deploy_info.resources | length > 0 and
        litellm_deploy_info.resources[0].status.availableReplicas is defined and
        litellm_deploy_info.resources[0].status.availableReplicas ==
        litellm_deploy_info.resources[0].spec.replicas
      retries: 60
      delay: 10
      delegate_to: localhost
