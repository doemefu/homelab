---
# Basis-Provisionierung: OS, Hardening, Storage, MBA-Tweaks
# Voraussetzung: 00_bootstrap.yml wurde bereits ausgeführt
# Ausführen mit: ansible-playbook infra/playbooks/10_base.yml
#                oder für einzelnen Node: -l pi5
- name: Base — OS, NTP, Packages, Unattended-Upgrades
  hosts: all
  become: true
  roles:
    - role: base

# Tag hardening rolls the UFW / fail2ban / sshd role out alone: --tags hardening (#98).
- name: Hardening — UFW, fail2ban, SSH
  hosts: all
  become: true
  tags: [hardening]
  roles:
    - role: hardening

# Tag storage rolls the backup role out alone: --tags storage (#301).
- name: Storage — Restic, Backup-Verzeichnisse, externer Mount (pi5)
  hosts: all
  become: true
  tags: [storage]
  roles:
    - role: storage

# NM-3 (homelab#117, docs/060 §5): LAN connection, UFW block and sshd auth textfile metrics.
# Tag netmon_node rolls it out alone: --tags netmon_node. Runs after Storage, which (with
# homelab PR #109) creates the node-exporter textfile directory; the role also creates it.
- name: Netmon — LAN connection, UFW block and sshd auth textfile metrics
  hosts: all
  become: true
  tags: [netmon_node]
  roles:
    - role: netmon_node

- name: Mac-Tweaks — Lid-close, T2-Kernel-Module (nur x86_64)
  hosts: mac
  become: true
  tags: [mac_tweaks]
  roles:
    - role: mac_tweaks
