---
# Basis-Provisionierung: OS, Hardening, Storage, MBA-Tweaks
# Voraussetzung: 00_bootstrap.yml wurde bereits ausgeführt
# Ausführen mit: ansible-playbook infra/playbooks/10_base.yml
#                oder für einzelnen Node: -l pi5
- name: Base — OS, NTP, Packages, Unattended-Upgrades
  hosts: all
  become: true
  roles:
    - role: base

- name: Hardening — UFW, fail2ban, SSH
  hosts: all
  become: true
  roles:
    - role: hardening

# NM-3 (homelab#117, docs/060 §5): LAN connection, UFW block and sshd auth textfile metrics.
# Tag netmon_node rolls it out alone: --tags netmon_node. Needs the node-exporter
# textfile directory from the storage role (homelab PR #109); until that exists the
# oneshot service fails each minute with a clear error and recovers on its own.
- name: Netmon — LAN connection, UFW block and sshd auth textfile metrics
  hosts: all
  become: true
  tags: [netmon_node]
  roles:
    - role: netmon_node

- name: Storage — Restic, Backup-Verzeichnisse, externer Mount (pi5)
  hosts: all
  become: true
  roles:
    - role: storage

- name: Mac-Tweaks — Lid-close, T2-Kernel-Module (nur x86_64)
  hosts: mac
  become: true
  roles:
    - role: mac_tweaks
