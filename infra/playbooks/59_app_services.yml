---
# App Services — K8s Secrets for device-service, auth-service, LiteLLM, and data-service
# Namespace: apps
#
# Prerequisites:
#   - 50_apps_infra.yml completed (PostgreSQL running)
#   - all.sops.yml contains the variables listed below
#
# Required SOPS variables (add once via: sops infra/inventory/group_vars/all.sops.yml):
#
#   homelab_db_username:       homelab
#   homelab_db_password:       <generated password>
#   device_service_mqtt_password: <placeholder until MQTT auth is enabled post-M6>
#   influxdb_admin_token:      <InfluxDB admin token (generated on first InfluxDB startup)>
#   auth_service_grafana_client_secret:       <from Grafana → Administration → Authentication → Generic OAuth>
#   auth_service_ha_client_secret:            <from Home Assistant → Settings → OAuth Clients>
#   auth_service_device_service_client_secret: <choose a random secret (plain, no {noop} prefix)>
#   auth_service_n8n_client_secret:           <choose a random secret for n8n OIDC client>
#   auth_service_furchert_ch_client_secret:   <random secret for furchert-ch OIDC client (plain, no {noop}); auth-service gets "{noop}<value>", furchert-ch gets "<value>">
#   furchert_ch_auth_secret:                  <Auth.js session secret, e.g. openssl rand -base64 33>
#   furchert_ch_smtp_password:                <Infomaniak application password for info@furchert.ch (contact-form SMTP, furchert-ch#46)>
#   n8n_encryption_key:                       <32+ char random key, e.g. openssl rand -hex 32>
#       auth-service receives "{noop}<value>" (prefix added by playbook)
#       device-service receives "<value>" (plain, as OAuth2 client-secret)
#       n8n receives "<value>" (plain, as OAuth2 client-secret)
#   auth_service_rsa_private_key: |
#     -----BEGIN RSA PRIVATE KEY-----
#     ...
#     -----END RSA PRIVATE KEY-----
#   auth_service_rsa_public_key: |
#     -----BEGIN PUBLIC KEY-----
#     ...
#     -----END PUBLIC KEY-----
#
# LiteLLM variables (generate with commands in all.sops.yml.example):
#   litellm_master_key:     sk-<openssl rand -hex 16>   # Bearer token for API access
#   litellm_salt_key:       <openssl rand -hex 32>       # WARNING: permanent — never rotate after first use
#   litellm_db_password:    <openssl rand -hex 16>       # Postgres password for litellm user
#   mistral_api_key:        <from console.mistral.ai>
#   mistral_codestral_api_key: <from console.mistral.ai> # dedicated key for codestral route
#   litellm_client_secret:  <openssl rand -hex 32>       # OIDC client secret for SSO UI login
#
# data-service variables (docs/060-network-monitoring.md §9):
#   data_service_db_password: <openssl rand -hex 24>     # Postgres password for the data_service role
#   data_service_cloudflare_analytics_token: <Cloudflare API token, zone furchert.ch, Analytics:Read>  # NM-1
#   data_service_cloudflare_zone_id: <zone ID of furchert.ch>                                          # NM-1
#   data_service_abuseipdb_key: <AbuseIPDB API key>  # NM-1 follow-up, optional; free plan key from abuseipdb.com
#       data-service receives it as data-service-secrets/abuseipdb-api-key (env ABUSEIPDB_API_KEY) and
#       enables the reputation collector. Unset = key skipped; set but empty = the play fails.
#       Removing it later does NOT delete the key — see DEPLOYMENT.md "NM-1 follow-up: AbuseIPDB key (optional)".
#
# NM-4 login-event variables (docs/060-network-monitoring.md §7.6, §9) — OPTIONAL:
#   auth_service_data_service_client_secret: <openssl rand -hex 32; plain, no {noop}>
#       auth-service receives "{noop}<value>" (homelab-auth-secrets/data-service-client-secret),
#       data-service receives "<value>" (data-service-secrets/auth-client-secret)
#   auth_service_login_event_hmac_key: <openssl rand -base64 48; at least 32 characters>
#       auth-service only (homelab-auth-secrets/login-event-hmac-key). Rotating it breaks
#       HMAC continuity for events already stored in data-service.
#   Set both or neither. With neither, the play skips these keys and auth-service keeps
#   login-event capture off. With only one, the play fails. Removing both later does NOT
#   delete keys created by an earlier run — see DEPLOYMENT.md "Turning NM-4 off".
#
# One-time RSA key generation (run once, then paste output into SOPS):
#   openssl genrsa -out /tmp/auth-rsa.pem 2048
#   openssl rsa -in /tmp/auth-rsa.pem -pubout -out /tmp/auth-rsa-pub.pem
#   cat /tmp/auth-rsa.pem        # → auth_service_rsa_private_key
#   cat /tmp/auth-rsa-pub.pem    # → auth_service_rsa_public_key
#   shred -u /tmp/auth-rsa.pem /tmp/auth-rsa-pub.pem
#
# Run: ansible-playbook infra/playbooks/59_app_services.yml

- name: App Services — database init + K8s secrets
  hosts: k3s_server
  gather_facts: false
  run_once: true
  vars:
    kubeconfig: "{{ lookup('env', 'HOME') }}/.kube/homelab.yaml"
    apps_namespace: apps
    postgresql_pod: postgresql-0
    # NM-4: the login-event keys are created only when both SOPS variables exist (see header).
    auth_service_login_events_configured: >-
      {{ auth_service_data_service_client_secret is defined
         and auth_service_login_event_hmac_key is defined }}

  tasks:

    # --- Guards ---

    - name: Prüfen dass alle benötigten SOPS-Variablen gesetzt sind
      ansible.builtin.assert:
        that:
          - homelab_db_username is defined and homelab_db_username | length > 0
          - homelab_db_username is match('^[a-z_][a-z0-9_]*$')
          - homelab_db_password is defined and homelab_db_password | length > 0
          - device_service_mqtt_password is defined and device_service_mqtt_password | length > 0
          - influxdb_admin_token is defined and influxdb_admin_token | length > 0
          - auth_service_grafana_client_secret is defined and auth_service_grafana_client_secret | length > 0
          - auth_service_ha_client_secret is defined and auth_service_ha_client_secret | length > 0
          - auth_service_device_service_client_secret is defined and auth_service_device_service_client_secret | length > 0
          - auth_service_n8n_client_secret is defined and auth_service_n8n_client_secret | length > 0
          - n8n_encryption_key is defined and n8n_encryption_key | length > 0
          - auth_service_rsa_private_key is defined and auth_service_rsa_private_key | length > 0
          - auth_service_rsa_public_key is defined and auth_service_rsa_public_key | length > 0
          - litellm_client_secret is defined and litellm_client_secret | length > 0
          - auth_service_furchert_ch_client_secret is defined and auth_service_furchert_ch_client_secret | length > 0
          - furchert_ch_auth_secret is defined and furchert_ch_auth_secret | length > 0
          - furchert_ch_smtp_password is defined and furchert_ch_smtp_password | length > 0
        fail_msg: >-
          One or more required SOPS variables are missing.
          Add them to infra/inventory/group_vars/all.sops.yml — see the header comment in this playbook.
      delegate_to: localhost

    - name: NM-4 login events — assert that both optional SOPS variables are set and valid
      ansible.builtin.assert:
        that:
          - auth_service_data_service_client_secret is defined
          - auth_service_data_service_client_secret | length > 0
          - auth_service_data_service_client_secret is not match('^[{]')
          - auth_service_login_event_hmac_key is defined
          - auth_service_login_event_hmac_key | length >= 32
        fail_msg: >-
          The NM-4 login-event variables must be set together:
          auth_service_data_service_client_secret (plain, without a {noop} prefix) and
          auth_service_login_event_hmac_key (at least 32 characters). Add both or remove both —
          see the header comment in this playbook.
      when: >-
        auth_service_data_service_client_secret is defined
        or auth_service_login_event_hmac_key is defined
      delegate_to: localhost

    - name: NM-1 AbuseIPDB — assert that the optional SOPS variable is not empty
      ansible.builtin.assert:
        that:
          - data_service_abuseipdb_key | length > 0
        fail_msg: >-
          data_service_abuseipdb_key is set but empty. Set the AbuseIPDB API key or remove the
          variable — see the header comment in this playbook.
      when: data_service_abuseipdb_key is defined
      delegate_to: localhost

    - name: NM-1 AbuseIPDB — report that the optional key is skipped
      ansible.builtin.debug:
        msg: >-
          data_service_abuseipdb_key is not set: skipping data-service-secrets/abuseipdb-api-key.
          A key created by an earlier run is NOT removed (see DEPLOYMENT.md "NM-1 follow-up: AbuseIPDB key
          (optional)"); without it, data-service keeps the reputation collector off.
      when: data_service_abuseipdb_key is not defined
      delegate_to: localhost

    - name: NM-4 login events — report that the optional keys are skipped
      ansible.builtin.debug:
        msg: >-
          auth_service_data_service_client_secret and auth_service_login_event_hmac_key are not set:
          skipping the NM-4 login-event Secret keys. Keys created by an earlier run are NOT removed
          (see DEPLOYMENT.md "Turning NM-4 off"); if none exist, auth-service keeps login-event capture off.
      when: not auth_service_login_events_configured
      delegate_to: localhost

    # --- PostgreSQL: database + user (idempotent) ---
    # kubernetes.core.k8s_exec runs shlex.split() on command strings, which breaks on mixed
    # quoting. Using ansible.builtin.command + kubectl exec bypasses that entirely.

    - name: Homelab PostgreSQL user anlegen (falls nicht vorhanden)
      ansible.builtin.command:
        argv:
          - kubectl
          - exec
          - -n
          - "{{ apps_namespace }}"
          - "{{ postgresql_pod }}"
          - --
          - sh
          - -c
          - >-
            psql -U postgres -tc
            "SELECT 1 FROM pg_roles WHERE rolname='{{ homelab_db_username }}'"
            | grep -q 1
            || psql -U postgres -c
            "CREATE ROLE {{ homelab_db_username }} WITH LOGIN"
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      delegate_to: localhost
      register: pg_create_user
      changed_when: "'CREATE ROLE' in pg_create_user.stdout"

    - name: Homelab PostgreSQL user Passwort setzen/aktualisieren
      ansible.builtin.command:
        argv:
          - kubectl
          - exec
          - -i
          - -n
          - "{{ apps_namespace }}"
          - "{{ postgresql_pod }}"
          - --
          - psql
          - -U
          - postgres
        stdin: |
          SELECT format(
            'ALTER ROLE %I WITH PASSWORD %L',
            convert_from(decode('{{ homelab_db_username | b64encode }}', 'base64'), 'UTF8'),
            convert_from(decode('{{ homelab_db_password | b64encode }}', 'base64'), 'UTF8')
          ) \gexec
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      no_log: true
      delegate_to: localhost
      # Password rotation is intentionally always enforced; SQL output is not a reliable change signal here.
      changed_when: false

    - name: Homelabdb Datenbank anlegen (falls nicht vorhanden)
      ansible.builtin.command:
        argv:
          - kubectl
          - exec
          - -n
          - "{{ apps_namespace }}"
          - "{{ postgresql_pod }}"
          - --
          - sh
          - -c
          - >-
            psql -U postgres -tc
            "SELECT 1 FROM pg_database WHERE datname='homelabdb'"
            | grep -q 1
            || psql -U postgres -c
            "CREATE DATABASE homelabdb OWNER {{ homelab_db_username }}"
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      delegate_to: localhost
      register: pg_create_db
      changed_when: "'CREATE DATABASE' in pg_create_db.stdout"

    # --- K8s secrets ---

    - name: Device-service-secrets anlegen
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: device-service-secrets
            namespace: "{{ apps_namespace }}"
          type: Opaque
          stringData:
            db-username: "{{ homelab_db_username }}"
            db-password: "{{ homelab_db_password }}"
            mqtt-password: "{{ device_service_mqtt_password }}"
            influx-token: "{{ influxdb_admin_token }}"
            device-service-client-secret: "{{ auth_service_device_service_client_secret }}"
      no_log: true
      delegate_to: localhost

    - name: Homelab-db-credentials anlegen (auth-service PostgreSQL)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: homelab-db-credentials
            namespace: "{{ apps_namespace }}"
          type: Opaque
          stringData:
            username: "{{ homelab_db_username }}"
            password: "{{ homelab_db_password }}"
      no_log: true
      delegate_to: localhost

    - name: Homelab-auth-secrets anlegen (OAuth2 client secrets)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: homelab-auth-secrets
            namespace: "{{ apps_namespace }}"
          type: Opaque
          stringData:
            grafana-client-secret: "{{ auth_service_grafana_client_secret }}"
            ha-client-secret: "{{ auth_service_ha_client_secret }}"
            device-service-client-secret: "{noop}{{ auth_service_device_service_client_secret }}"
            n8n-client-secret-authservice: "{noop}{{ auth_service_n8n_client_secret }}"
            n8n-client-secret: "{{ auth_service_n8n_client_secret }}"
            litellm-client-secret-authservice: "{noop}{{ litellm_client_secret }}"
            furchert-ch-client-secret: "{noop}{{ auth_service_furchert_ch_client_secret }}"
      no_log: true
      delegate_to: localhost

    # A second task instead of extra keys above, because the NM-4 variables are optional.
    # kubernetes.core.k8s patches an existing Secret (no force), so both tasks keep each
    # other's keys, and a second run reports no change.
    - name: Homelab-auth-secrets — add the NM-4 login-event keys (data-service client, HMAC key)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: homelab-auth-secrets
            namespace: "{{ apps_namespace }}"
          type: Opaque
          stringData:
            # Read by auth-service as DATA_SERVICE_CLIENT_SECRET / LOGIN_EVENT_HMAC_KEY
            # (optional secretKeyRefs, docs/060 §9). Restart auth-service after adding them.
            data-service-client-secret: "{noop}{{ auth_service_data_service_client_secret }}"
            login-event-hmac-key: "{{ auth_service_login_event_hmac_key }}"
      when: auth_service_login_events_configured
      no_log: true
      delegate_to: localhost

    - name: Create furchert-ch-secrets (Auth.js session, OIDC client secret, SMTP password)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: furchert-ch-secrets
            namespace: "{{ apps_namespace }}"
          type: Opaque
          stringData:
            auth-secret: "{{ furchert_ch_auth_secret }}"
            # Plain client secret — must equal the plaintext stored "{noop}"-prefixed for the
            # furchert-ch OIDC client in homelab-auth-secrets above, so they match by construction.
            oidc-client-secret: "{{ auth_service_furchert_ch_client_secret }}"
            # Infomaniak application password for info@furchert.ch — used by
            # furchert-ch's contact-form SMTP delivery (furchert-ch#46).
            smtp-password: "{{ furchert_ch_smtp_password }}"
      no_log: true
      delegate_to: localhost

    - name: N8n-secrets anlegen (encryption key)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: n8n-secrets
            namespace: "{{ apps_namespace }}"
          type: Opaque
          stringData:
            encryption-key: "{{ n8n_encryption_key }}"
      no_log: true
      delegate_to: localhost

    - name: Homelab-auth-rsa-keys anlegen (JWT signing keys)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: homelab-auth-rsa-keys
            namespace: "{{ apps_namespace }}"
          type: Opaque
          stringData:
            private.pem: "{{ auth_service_rsa_private_key }}"
            public.pem: "{{ auth_service_rsa_public_key }}"
      no_log: true
      delegate_to: localhost

    # --- LiteLLM: PostgreSQL database + secrets ---

    - name: LiteLLM — Prüfen dass alle benötigten SOPS-Variablen gesetzt sind
      ansible.builtin.assert:
        that:
          - litellm_master_key is defined and litellm_master_key | length > 0
          - litellm_master_key is match('^sk-')
          - litellm_salt_key is defined and litellm_salt_key | length > 0
          - litellm_db_password is defined and litellm_db_password | length > 0
          - mistral_api_key is defined and mistral_api_key | length > 0
          - mistral_codestral_api_key is defined and mistral_codestral_api_key | length > 0
          - litellm_gemini_api_key is defined and litellm_gemini_api_key | length > 0
          - litellm_anthropic_api_key is defined and litellm_anthropic_api_key | length > 0
          - mistral_vibe_api_key is defined and mistral_vibe_api_key | length > 0
        fail_msg: >-
          One or more required LiteLLM SOPS variables are missing or invalid.
          litellm_master_key must start with 'sk-'.
          Add them to infra/inventory/group_vars/all.sops.yml — see all.sops.yml.example for commands.
      delegate_to: localhost

    - name: LiteLLM PostgreSQL user anlegen (falls nicht vorhanden)
      ansible.builtin.command:
        argv:
          - kubectl
          - exec
          - -n
          - "{{ apps_namespace }}"
          - "{{ postgresql_pod }}"
          - --
          - sh
          - -c
          - >-
            psql -U postgres -tc
            "SELECT 1 FROM pg_roles WHERE rolname='litellm'"
            | grep -q 1
            || psql -U postgres -c
            "CREATE ROLE litellm WITH LOGIN"
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      delegate_to: localhost
      register: pg_litellm_create_user
      changed_when: "'CREATE ROLE' in pg_litellm_create_user.stdout"

    - name: LiteLLM PostgreSQL user Passwort setzen/aktualisieren
      ansible.builtin.command:
        argv:
          - kubectl
          - exec
          - -i
          - -n
          - "{{ apps_namespace }}"
          - "{{ postgresql_pod }}"
          - --
          - psql
          - -U
          - postgres
        stdin: |
          SELECT format(
            'ALTER ROLE %I WITH PASSWORD %L',
            convert_from(decode('{{ 'litellm' | b64encode }}', 'base64'), 'UTF8'),
            convert_from(decode('{{ litellm_db_password | b64encode }}', 'base64'), 'UTF8')
          ) \gexec
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      no_log: true
      delegate_to: localhost
      changed_when: false

    - name: LiteLLM Datenbank anlegen (falls nicht vorhanden)
      ansible.builtin.command:
        argv:
          - kubectl
          - exec
          - -n
          - "{{ apps_namespace }}"
          - "{{ postgresql_pod }}"
          - --
          - sh
          - -c
          - >-
            psql -U postgres -tc
            "SELECT 1 FROM pg_database WHERE datname='litellm'"
            | grep -q 1
            || psql -U postgres -c
            "CREATE DATABASE litellm OWNER litellm"
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      delegate_to: localhost
      register: pg_litellm_create_db
      changed_when: "'CREATE DATABASE' in pg_litellm_create_db.stdout"

    - name: LiteLLM-secrets anlegen (API keys, master key, salt key, DB URL)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: litellm-secrets
            namespace: "{{ apps_namespace }}"
          type: Opaque
          stringData:
            LITELLM_MASTER_KEY: "{{ litellm_master_key }}"
            LITELLM_SALT_KEY: "{{ litellm_salt_key }}"
            DATABASE_URL: "postgresql://litellm:{{ litellm_db_password }}@postgresql.apps.svc.cluster.local:5432/litellm"
            MISTRAL_API_KEY: "{{ mistral_api_key }}"
            MISTRAL_CODESTRAL_KEY: "{{ mistral_codestral_api_key }}"
            GEMINI_API_KEY: "{{ litellm_gemini_api_key }}"
            ANTHROPIC_API_KEY: "{{ litellm_anthropic_api_key }}"
            MISTRAL_VIBE_API_KEY: "{{ mistral_vibe_api_key }}"
            LITELLM_OIDC_CLIENT_SECRET: "{{ litellm_client_secret }}"
      no_log: true
      delegate_to: localhost

    # --- data-service: PostgreSQL database + secrets (docs/060-network-monitoring.md §3.1, §9) ---
    # DB name = role name = data_service, like litellm. Flyway (data-service) creates the schema netmon.

    - name: Data-service — assert that the required SOPS variables are set
      ansible.builtin.assert:
        that:
          - data_service_db_password is defined and data_service_db_password | length > 0
          - data_service_cloudflare_analytics_token is defined and data_service_cloudflare_analytics_token | length > 0
          - data_service_cloudflare_zone_id is defined and data_service_cloudflare_zone_id | length > 0
        fail_msg: >-
          A data-service SOPS variable is missing (data_service_db_password,
          data_service_cloudflare_analytics_token or data_service_cloudflare_zone_id).
          Add it to infra/inventory/group_vars/all.sops.yml — see all.sops.yml.example for the command.
      delegate_to: localhost

    - name: Data-service — create PostgreSQL role (if missing)
      ansible.builtin.command:
        argv:
          - kubectl
          - exec
          - -n
          - "{{ apps_namespace }}"
          - "{{ postgresql_pod }}"
          - --
          - sh
          - -c
          - >-
            psql -U postgres -tc
            "SELECT 1 FROM pg_roles WHERE rolname='data_service'"
            | grep -q 1
            || psql -U postgres -c
            "CREATE ROLE data_service WITH LOGIN"
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      delegate_to: localhost
      register: pg_data_service_create_user
      changed_when: "'CREATE ROLE' in pg_data_service_create_user.stdout"

    - name: Data-service — set/update PostgreSQL role password
      ansible.builtin.command:
        argv:
          - kubectl
          - exec
          - -i
          - -n
          - "{{ apps_namespace }}"
          - "{{ postgresql_pod }}"
          - --
          - psql
          - -U
          - postgres
        stdin: |
          SELECT format(
            'ALTER ROLE %I WITH PASSWORD %L',
            convert_from(decode('{{ 'data_service' | b64encode }}', 'base64'), 'UTF8'),
            convert_from(decode('{{ data_service_db_password | b64encode }}', 'base64'), 'UTF8')
          ) \gexec
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      no_log: true
      delegate_to: localhost
      # Password rotation is intentionally always enforced; SQL output is not a reliable change signal here.
      changed_when: false

    - name: Data-service — create PostgreSQL database (if missing)
      ansible.builtin.command:
        argv:
          - kubectl
          - exec
          - -n
          - "{{ apps_namespace }}"
          - "{{ postgresql_pod }}"
          - --
          - sh
          - -c
          - >-
            psql -U postgres -tc
            "SELECT 1 FROM pg_database WHERE datname='data_service'"
            | grep -q 1
            || psql -U postgres -c
            "CREATE DATABASE data_service OWNER data_service"
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      delegate_to: localhost
      register: pg_data_service_create_db
      changed_when: "'CREATE DATABASE' in pg_data_service_create_db.stdout"

    - name: Data-service — create data-service-secrets (DB credentials, Cloudflare API)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: data-service-secrets
            namespace: "{{ apps_namespace }}"
          type: Opaque
          stringData:
            # Keys per docs/060-network-monitoring.md §9. NM-0: DB credentials.
            # NM-1 (#116): Cloudflare GraphQL Analytics token + zone ID, read by the
            # inbound collector as CLOUDFLARE_API_TOKEN / CLOUDFLARE_ZONE_ID. Env vars are
            # read at pod start: restart data-service after adding or rotating a key.
            # The optional abuseipdb-api-key (NM-1 follow-up) and NM-4's auth-client-secret
            # are added by the next tasks (optional variables).
            db-username: data_service
            db-password: "{{ data_service_db_password }}"
            cloudflare-api-token: "{{ data_service_cloudflare_analytics_token }}"
            cloudflare-zone-id: "{{ data_service_cloudflare_zone_id }}"
      no_log: true
      delegate_to: localhost

    - name: Data-service — add the NM-4 auth-client-secret key (login-event pull)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: data-service-secrets
            namespace: "{{ apps_namespace }}"
          type: Opaque
          stringData:
            # Plain client secret — must equal the plaintext stored "{noop}"-prefixed for the
            # data-service client in homelab-auth-secrets, so they match by construction.
            # Read by data-service as AUTH_CLIENT_SECRET (optional secretKeyRef, docs/060 §9).
            auth-client-secret: "{{ auth_service_data_service_client_secret }}"
      when: auth_service_login_events_configured
      no_log: true
      delegate_to: localhost

    - name: Data-service — add the optional abuseipdb-api-key key (NM-1 follow-up, reputation collector)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: data-service-secrets
            namespace: "{{ apps_namespace }}"
          type: Opaque
          stringData:
            # Read by data-service as ABUSEIPDB_API_KEY (optional secretKeyRef, docs/060 §4.5, §9).
            # Env vars are read at pod start: delete the data-service pod after adding it.
            abuseipdb-api-key: "{{ data_service_abuseipdb_key }}"
      when: data_service_abuseipdb_key is defined
      no_log: true
      delegate_to: localhost
