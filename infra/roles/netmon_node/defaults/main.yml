---
# netmon_node — LAN connection, UFW block and sshd auth textfile metrics (NM-3, homelab#117).
# Contract: docs/060-network-monitoring.md §5. Metric names, labels and the bucket length
# are read by data-service's LAN snapshot collector (§4.6) — change them there first.

# Sources inside this CIDR are emitted verbatim; pod IPs become the literal pod CIDR;
# anything else becomes "other" (public IPs stay verbatim for UFW and sshd only).
netmon_node_lan_cidr: "{{ lan_subnet | default('192.168.1.0/24') }}"
# k3s pod CIDR — same value as hardening_k3s_pod_cidr (roles cannot read each other's defaults).
netmon_node_pod_cidr: "10.42.0.0/16"

# Watched local TCP ports: mosquitto, SSH, Home Assistant, k3s API, kubelet (IPv4 conntrack only).
netmon_node_ports: [1883, 22, 8123, 6443, 10250]

# Hard cap per metric per node; the overflow is summed into src_ip="other" and counted in
# homelab_netmon_truncated_series (alert NetmonSeriesTruncated).
netmon_node_max_series: 200

# Bucket length for the *_bucket gauges. Contract value (15 min, aligned to :00/:15/:30/:45);
# data-service's collector assumes it — do not change it here alone.
netmon_node_bucket_seconds: 900

# Timer cadence (docs/060 §5.1): every minute at second 05.
netmon_node_on_calendar: "*-*-* *:*:05"

# sshd's systemd unit on Ubuntu 24.04 (the hardening role's handler reloads the same unit).
netmon_node_sshd_unit: ssh

# node-exporter textfile directory (hostPath in PR #109). Created here and by the storage
# role with identical attributes. Must match storage_textfile_collector_dir.
netmon_node_textfile_dir: /var/lib/node_exporter/textfile_collector
netmon_node_script: /usr/local/sbin/homelab-netmon-collect

# net.netfilter.nf_conntrack_acct (byte counters per flow). NM-3 does not need it; only the
# NM-2 conntrack-egress fallback (docs/060 §6.6) sets it to true.
netmon_node_conntrack_acct: false
