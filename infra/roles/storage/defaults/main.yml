---
storage_backup_dir: "/var/lib/backup"
storage_backup_mount: "/mnt/backup"

# Ob dieser Node ein externes Backup-Device hat (pi5: true, alle anderen: false)
storage_has_external_backup: false

# Gerätepfad des externen Backup-Devices (nur relevant wenn storage_has_external_backup: true)
# Beispiel: /dev/disk/by-uuid/XXXX-XXXX
storage_backup_device: ""
storage_backup_fstype: "ext4"

# Restic Backup-Automatisierung (M4)
# storage_run_restic_backup: true aktiviert Repo-Init, Passwort-Datei, Skript + Cron auf diesem Node
# Nur auf pi5 aktiviert (k3s_server.yml) — alle anderen Nodes: false
storage_run_restic_backup: false

# restic is installed on every node from the Ubuntu 24.04 archive (#94). The apt module treats the version as
# an fnmatch pattern, so every Ubuntu security rebuild of 0.16.4 (0.16.4-2ubuntu0.24.04.N) passes without a
# bump, while the release-pocket build 0.16.4-2 does not match. The pattern is stricter than the range the owner
# approved (0.16.4-*, Dominic, 2026-11-07, an exception to the exact-pin rule). If Ubuntu moves restic to a new
# upstream version (0.16.5, 0.17, ...), unattended-upgrades installs it and this task then fails: the installed
# version no longer matches and apt refuses the downgrade. A fresh node fails the same way once no matching build
# is left in the index. Fix: `apt-cache policy restic` on a node, set the new pattern here, run
# `10_base.yml --tags storage`.
storage_restic_version: "0.16.4-2ubuntu0.24.04.*"

# Restic Repository-Pfad (lokales Verzeichnis, interim bis externe SSD angeschlossen)
# Follow-up: /mnt/backup/restic-repo nach SSD-Anschluss (Prozess in DEPLOYMENT.md)
storage_restic_repo: "{{ storage_backup_dir }}/restic-repo"

# Pfade die gesichert werden — safe default (leer; wird in k3s_server.yml überschrieben)
# Nicht k3s-spezifische Pfade im Default, um Fehler auf Nicht-k3s-Nodes zu vermeiden
storage_backup_paths: []

# node-exporter textfile collector directory (#92). homelab-backup.sh writes
# homelab-backup.prom here and the node-exporter DaemonSet mounts the same path
# read-only — the other half of the contract lives in
# cluster/values/kube-prometheus-stack.yaml (prometheus-node-exporter.extraArgs +
# extraHostVolumeMounts). Change both together or the backup metrics disappear.
# Created on every node, not just on the restic node: the collector flag is
# fleet-wide and node-exporter reports node_textfile_scrape_error=1 wherever the
# directory is missing.
storage_textfile_collector_dir: /var/lib/node_exporter/textfile_collector

# k3s SQLite (kine) datastore — the live file, and where the pre-backup consistent copy is
# written (#64). k3s runs the embedded SQLite datastore here, not etcd, so there are no
# etcd snapshots under server/db/snapshots/ to back up directly (see homelab-backup.sh).
storage_k3s_state_db: /var/lib/rancher/k3s/server/db/state.db
storage_k3s_state_copy: "{{ storage_backup_dir }}/k3s-state.db"

# Recurring restic integrity check (#301): homelab-backup.sh reads back one of N slices of the
# pack files each night (restic check --read-data-subset=<slice>/N), so every pack is verified
# once every N days. 0 switches the check off.
storage_restic_check_subset_days: 7

# Off-node freshness marker (#301): installs /usr/local/bin/homelab-backup-mark, which the Mac
# backup scripts call over SSH. Lives where the restic backup runs.
storage_offnode_marker_enabled: "{{ storage_run_restic_backup }}"
