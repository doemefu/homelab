---
- name: Restic installieren
  ansible.builtin.apt:
    name: restic
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Lokales Backup-Verzeichnis anlegen
  ansible.builtin.file:
    path: "{{ storage_backup_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

# Every node runs node-exporter with --collector.textfile.directory pointing here
# (cluster/values/kube-prometheus-stack.yaml), so the directory must exist fleet-wide
# even where no backup writes into it — otherwise node-exporter raises
# node_textfile_scrape_error=1. Mode 0755 because node-exporter runs as UID 65534.
- name: Create node-exporter textfile collector directory
  ansible.builtin.file:
    path: "{{ storage_textfile_collector_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# --- Externer Backup-Mount (nur pi5) ---

- name: Backup-Mountpoint anlegen (externer USB/SSD)
  ansible.builtin.file:
    path: "{{ storage_backup_mount }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  when: storage_has_external_backup

- name: Prüfen ob externes Backup-Device konfiguriert ist
  ansible.builtin.assert:
    that:
      - storage_backup_device | length > 0
    fail_msg: >
      storage_backup_device ist leer. Bitte den Gerätepfad in
      group_vars/k3s_server.yml setzen (z.B. /dev/disk/by-uuid/XXXX).
    success_msg: "Backup-Device konfiguriert: {{ storage_backup_device }}"
  when: storage_has_external_backup
  ignore_errors: true
  register: storage_device_check

- name: Warnung ausgeben wenn Backup-Device fehlt
  ansible.builtin.debug:
    msg: >
      WARNUNG: storage_backup_device ist nicht gesetzt.
      USB/SSD-Mount wird übersprungen. Bitte später in
      group_vars/k3s_server.yml konfigurieren.
  when:
    - storage_has_external_backup
    - storage_device_check is failed

- name: Externes Backup-Device mounten
  ansible.posix.mount:
    path: "{{ storage_backup_mount }}"
    src: "{{ storage_backup_device }}"
    fstype: "{{ storage_backup_fstype }}"
    opts: defaults,nofail
    state: mounted
  when:
    - storage_has_external_backup
    - storage_device_check is succeeded
    - storage_backup_device | length > 0

# --- Restic Backup-Automatisierung (nur wenn storage_run_restic_backup: true) ---

- name: Sicherstellen dass storage_backup_paths gesetzt ist
  ansible.builtin.assert:
    that: storage_backup_paths | length > 0
    fail_msg: >
      storage_run_restic_backup ist aktiviert aber storage_backup_paths ist leer.
      Bitte Backup-Pfade in group_vars/k3s_server.yml definieren.
  when: storage_run_restic_backup

- name: Restic Passwort-Datei anlegen
  ansible.builtin.copy:
    content: "{{ restic_password }}"
    dest: /etc/restic-password
    owner: root
    group: root
    mode: "0600"
  when: storage_run_restic_backup
  no_log: true

- name: Restic Repository initialisieren
  ansible.builtin.command:
    cmd: >
      restic init
      --repo {{ storage_restic_repo }}
      --password-file /etc/restic-password
    creates: "{{ storage_restic_repo }}/config"
  when: storage_run_restic_backup

- name: Backup-Skript anlegen (/usr/local/bin/homelab-backup.sh)
  ansible.builtin.copy:
    dest: /usr/local/bin/homelab-backup.sh
    owner: root
    group: root
    mode: "0750"
    content: |
      #!/bin/bash
      # homelab-backup.sh — Restic Backup Script
      # Verwaltet von Ansible (storage role) — nicht manuell bearbeiten
      set -euo pipefail

      # Cron (03:00) and a manual run (see "Manual Backup" in DEPLOYMENT.md) must never race
      # on the fixed copy paths below — take an exclusive lock for the whole script.
      exec 9>/var/lock/homelab-backup.lock
      flock -n 9 || { logger -p user.err -t homelab-backup "another backup run is active, aborting"; exit 1; }

      # Node-exporter textfile metrics (#92). node-exporter mounts this directory
      # read-only and scrapes *.prom from it, so a failed or missing run becomes an
      # Alertmanager alert instead of a log line nobody reads.
      # The lock collision above exits before this point on purpose: the run that holds
      # the lock owns the metrics, and writing a failure here would be a false alarm.
      METRICS_FILE="{{ storage_textfile_collector_dir }}/homelab-backup.prom"
      START_TS=$(date +%s)

      # Carry the previous last-success timestamp forward so a failed run does not erase
      # it. Guarded on every side: a missing file must not abort the script under
      # `set -e`, and a non-numeric or empty value would produce a malformed .prom line,
      # which makes node-exporter discard the whole file (node_textfile_scrape_error=1)
      # and would then look like a stale backup. 0 reads as "never succeeded".
      LAST_SUCCESS=$(awk '$1 == "homelab_backup_last_success_timestamp_seconds" { print $2 }' \
        "$METRICS_FILE" 2>/dev/null | tail -n 1 || echo 0)
      LAST_SUCCESS=${LAST_SUCCESS:-0}
      case "$LAST_SUCCESS" in
        ''|*[!0-9]*) LAST_SUCCESS=0 ;;
      esac

      # Written to a temp file in the same directory and moved into place, so a scrape
      # never observes a partially written file. mktemp creates 0600; node-exporter runs
      # as UID 65534, hence the chmod before the rename. The temp name does not end in
      # .prom, so the collector ignores it even if a run dies mid-write.
      write_metrics() {
        rc=$1
        now=$(date +%s)
        success_ts=$LAST_SUCCESS
        if [ "$rc" -eq 0 ]; then
          success_ts=$now
        fi
        tmp_metrics=$(mktemp "${METRICS_FILE}.XXXXXX")
        {
          echo "# HELP homelab_backup_exit_code Exit status of the most recent homelab-backup.sh run (0 = success)."
          echo "# TYPE homelab_backup_exit_code gauge"
          echo "homelab_backup_exit_code ${rc}"
          echo "# HELP homelab_backup_duration_seconds Wall-clock duration of the most recent homelab-backup.sh run."
          echo "# TYPE homelab_backup_duration_seconds gauge"
          echo "homelab_backup_duration_seconds $((now - START_TS))"
          echo "# HELP homelab_backup_last_success_timestamp_seconds Unix time of the last successful homelab-backup.sh run."
          echo "# TYPE homelab_backup_last_success_timestamp_seconds gauge"
          echo "homelab_backup_last_success_timestamp_seconds ${success_ts}"
        } >"$tmp_metrics"
        chmod 0644 "$tmp_metrics"
        mv "$tmp_metrics" "$METRICS_FILE"
      }

      export RESTIC_PASSWORD_FILE=/etc/restic-password
      REPO="{{ storage_restic_repo }}"

      logger -t "homelab-backup" "Backup gestartet"

      # Consistent copy of the k3s SQLite (kine) datastore via sqlite3's online backup API
      # (#64), taken before restic runs so the snapshot isn't torn by a concurrent writer.
      # The umask is scoped to just the copy step below (restored right after) so the restic
      # repository keeps its existing file modes; the copy — which contains every cluster
      # Secret in plaintext — is never created world-readable and never survives past this
      # run once restic has backed it up (EXIT trap).
      SRC="{{ storage_k3s_state_db }}"
      COPY="{{ storage_k3s_state_copy }}"
      TMP="${COPY}.tmp"
      # A copy left behind by an interrupted run must never reach restic as stale state.
      rm -f "$TMP" "$COPY"
      # One EXIT trap only — a second `trap ... EXIT` would silently replace this one.
      # rc must be captured first, before any command in the handler overwrites $?.
      on_exit() {
        rc=$?
        rm -f "$TMP" "$COPY"
        write_metrics "$rc" || logger -p user.err -t homelab-backup "failed to write textfile metrics"
      }
      trap on_exit EXIT

      if [ -f "$SRC" ]; then
      OLDMASK=$(umask)
      umask 077
      python3 - "$SRC" "$TMP" <<'PY' || { logger -p user.err -t homelab-backup "k3s datastore copy failed"; exit 1; }
      {% raw %}
      import sqlite3
      import sys

      src, tmp = sys.argv[1:3]
      source = sqlite3.connect(f"file:{src}?mode=ro", uri=True)
      dest = sqlite3.connect(tmp)
      with dest:
          source.backup(dest, pages=-1)
      dest.close()
      source.close()
      {% endraw %}
      PY
      mv "$TMP" "$COPY"
      umask "$OLDMASK"
      else
      # A missing datastore is a configuration error, not a skip — the daily -p err
      # checklist command (DEPLOYMENT.md "Regular Maintenance Checklist") must catch it.
      logger -p user.err -t homelab-backup "k3s datastore not found at $SRC"
      exit 1
      fi

      restic backup --repo "${REPO}" {{ storage_backup_paths | join(' ') }}

      restic forget --repo "${REPO}" \
        --keep-daily 7 --keep-weekly 4 --keep-monthly 6 --prune

      logger -t "homelab-backup" "Backup abgeschlossen"
  when: storage_run_restic_backup

- name: Restic Backup Cron-Job anlegen (täglich 03:00)
  ansible.builtin.cron:
    name: "homelab-restic-backup"
    minute: "0"
    hour: "3"
    job: "/usr/local/bin/homelab-backup.sh >> /var/log/homelab-backup.log 2>&1"
    user: root
    state: present
  when: storage_run_restic_backup
