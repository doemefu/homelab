---
- name: UFW installieren
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: UFW — Default Policy incoming deny
  community.general.ufw:
    direction: incoming
    policy: deny

- name: UFW — Default Policy outgoing allow
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: UFW — LAN-Ports öffnen
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    src: "{{ hardening_lan_subnet }}"
    comment: "{{ item.comment }}"
  loop: "{{ hardening_ufw_lan_ports }}"

- name: UFW — Pod CIDR freigeben (k3s cross-node Traffic)
  community.general.ufw:
    rule: allow
    src: "{{ hardening_k3s_pod_cidr }}"
    comment: "k3s Pod CIDR (Flannel)"

- name: UFW — Service CIDR freigeben (k3s cross-node Traffic)
  community.general.ufw:
    rule: allow
    src: "{{ hardening_k3s_service_cidr }}"
    comment: "k3s Service CIDR"

- name: UFW aktivieren (logging on)
  community.general.ufw:
    state: enabled
    logging: "on"

# The jail reads sshd's journal (backend = systemd below), which needs the systemd Python
# bindings. Ubuntu 24.04's fail2ban already depends on python3-systemd and its
# defaults-debian.conf already sets backend = systemd; both are explicit here so the jail does
# not hinge on distro defaults (no /var/log/auth.log needed).
- name: Install fail2ban
  ansible.builtin.apt:
    name:
      - fail2ban
      - python3-systemd
    state: present

- name: Configure the fail2ban sshd jail
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd.conf
    content: |
      [sshd]
      enabled  = true
      backend  = systemd
      port     = ssh
      filter   = sshd
      maxretry = 5
      bantime  = 3600
      findtime = 600
      ignoreip = {{ hardening_fail2ban_ignoreip | join(' ') }}
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Enable and start fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    enabled: true
    masked: false
    state: started
  ignore_errors: "{{ ansible_check_mode }}"

- name: SSH-Hardening Drop-in anlegen
  ansible.builtin.template:
    src: sshd_hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    owner: root
    group: root
    mode: "0600"
  notify: Reload sshd

# fail2ban.service is Type=simple: `systemctl start` returns before the server has read its
# configuration, so a server that exits right after (configuration error, missing Python module)
# looked like a successful start and was "changed" on every run (#98). These checks run last, so
# a broken fail2ban cannot hold back the sshd drop-in above; they fail the host with the reason.
- name: Test the fail2ban configuration
  ansible.builtin.command:
    cmd: fail2ban-client --test
  changed_when: false
  when: not ansible_check_mode

- name: Apply pending fail2ban and sshd restarts before the check
  ansible.builtin.meta: flush_handlers

- name: Verify that fail2ban runs the sshd jail
  ansible.builtin.command:
    cmd: fail2ban-client status sshd
  register: hardening_fail2ban_status
  retries: 20
  delay: 3
  until: hardening_fail2ban_status.rc == 0
  changed_when: false
  when: not ansible_check_mode
