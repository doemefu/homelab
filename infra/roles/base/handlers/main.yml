---
- name: Restart chrony
  ansible.builtin.service:
    name: chrony
    state: restarted
  ignore_errors: "{{ ansible_check_mode }}"

- name: Restart unattended-upgrades
  ansible.builtin.service:
    name: unattended-upgrades
    state: restarted

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
