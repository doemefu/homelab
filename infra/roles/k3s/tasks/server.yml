---
- name: Remove the manual etcd health-check drop-in from the homelab#129 incident (now applied via the systemd unit)
  ansible.builtin.file:
    path: "{{ k3s_kubeconfig_dir }}/config.yaml.d/90-incident-129-etcd-healthcheck.yaml"
    state: absent

# homelab#158: kube-apiserver audit policy and log directory (control-plane only).
- name: Install the kube-apiserver audit policy
  ansible.builtin.template:
    src: audit-policy.yaml.j2
    dest: "{{ k3s_audit_policy_file }}"
    owner: root
    group: root
    mode: "0600"
  when: k3s_audit_log_enabled | bool
  notify: Restart k3s

- name: Create the kube-apiserver audit log directory
  ansible.builtin.file:
    path: "{{ k3s_audit_log_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: k3s_audit_log_enabled | bool

# diff: false — before homelab#156 this unit embedded the join token, so a --diff of the
# migration would print it. The unit itself holds no secret any more.
- name: K3s Server Systemd-Service anlegen
  ansible.builtin.template:
    src: k3s-server.service.j2
    dest: /etc/systemd/system/k3s.service
    owner: root
    group: root
    mode: "0644"
  diff: false
  notify:
    - Reload systemd
    - Restart k3s

- name: K3s Server aktivieren und starten
  ansible.builtin.service:
    name: k3s
    state: started
    enabled: true
  ignore_errors: "{{ ansible_check_mode }}"

- name: Warten bis k3s API-Server bereit ist
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: 6443
    timeout: 120
  when: not ansible_check_mode
