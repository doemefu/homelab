# The agent serves /metrics and Go's /debug/pprof/* (net/http/pprof is imported in main.go and
# registered on the same default mux; v1.35.10 has no flag to disable it) unauthenticated on
# pod IP :80, from a privileged hostPID pod. This policy admits other pods only if they are the
# kube-prometheus-stack Prometheus. k3s enforces NetworkPolicy with its embedded controller.
# LIMIT: Kubernetes always admits traffic from the pod's own node, so host processes and
# hostNetwork pods on an agent node (node-exporter, svclb, Home Assistant) can still reach
# :80 including pprof. Accepted residual risk (2026-09-24, #118): DEPLOYMENT.md "coroot-node-agent (NM-2)".
# Pod labels verified on prometheus-kube-prometheus-stack-prometheus-0 (chart 69.3.1, 2026-09-23).
# Broader NetworkPolicy coverage for the cluster: homelab#127.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: coroot-node-agent
  namespace: monitoring
  labels:
    app.kubernetes.io/name: coroot-node-agent
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: coroot-node-agent
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              operator.prometheus.io/name: kube-prometheus-stack-prometheus
      ports:
        - protocol: TCP
          port: 80
