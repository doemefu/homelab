# The agent serves /metrics and Go's /debug/pprof/* (net/http/pprof is imported in main.go)
# unauthenticated on pod IP :80, from a privileged hostPID pod. Only the kube-prometheus-stack
# Prometheus may reach it. k3s enforces NetworkPolicy with its embedded controller.
# Pod labels verified on prometheus-kube-prometheus-stack-prometheus-0 (chart 69.3.1, 2026-09-23).
# Broader NetworkPolicy coverage for the cluster: homelab#127.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: coroot-node-agent
  namespace: monitoring
  labels:
    app.kubernetes.io/name: coroot-node-agent
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: coroot-node-agent
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              operator.prometheus.io/name: kube-prometheus-stack-prometheus
      ports:
        - protocol: TCP
          port: 80
