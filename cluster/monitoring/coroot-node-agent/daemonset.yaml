# coroot-node-agent — eBPF egress/east-west visibility (NM-2, docs/060-network-monitoring.md §6).
#
# Hand-written instead of the Helm chart (stale at 0.2.21). Flags, mounts and the listen port
# were verified against the v1.35.10 source (flags/flags.go, flags/flags_linux.go) and the
# coroot-operator v1.10.2 DaemonSet (controller/node_agent.go) on 2026-09-23.
#
# Approved privileged workload: privileged + hostPID are required for the eBPF programs and
# for reaching the host's /proc/1/root (containerd socket /run/k3s/containerd/containerd.sock,
# which the agent probes by default) — owner approval recorded in docs/060 §10.
#
# SPIKE GATE: the pod only schedules on nodes labelled
# `homelab.furchert.ch/coroot-node-agent=enabled`. 41_monitoring.yml manages that label from
# `coroot_node_agent_nodes` (raspi5 + mba1 since the 2026-09-24 spike); applying this manifest
# alone starts no pod on an unlabelled node.
# Runbook: DEPLOYMENT.md "coroot-node-agent (NM-2)".
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: coroot-node-agent
  namespace: monitoring
  labels:
    app.kubernetes.io/name: coroot-node-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: coroot-node-agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coroot-node-agent
    spec:
      # The agent talks to containerd and the kernel only; it never calls the Kubernetes API.
      automountServiceAccountToken: false
      hostPID: true
      nodeSelector:
        kubernetes.io/os: linux
        homelab.furchert.ch/coroot-node-agent: "enabled"
      tolerations:
        - operator: Exists
      containers:
        - name: coroot-node-agent
          # Image: ghcr.io/coroot/coroot-node-agent 1.35.10 (released 2026-09-16, linux/amd64 + linux/arm64).
          # Multi-arch index digest sha256:f1b386cf846aa60cac18ad572c3017729c040b68bc8e76a3d8b9616beec468ce
          # resolved 2026-09-23 via `docker buildx imagetools inspect` (#118). Bumped by hand — see
          # CONTRIBUTING.md "Digest-Pinned Platform Images".
          image: ghcr.io/coroot/coroot-node-agent:1.35.10@sha256:f1b386cf846aa60cac18ad572c3017729c040b68bc8e76a3d8b9616beec468ce
          args:
            - --cgroupfs-root=/host/sys/fs/cgroup
            # Default is 0.0.0.0:80; set explicitly because the Service/ServiceMonitor depend on it.
            - --listen=0.0.0.0:80
            # Metrics-only: no --collector-endpoint/--metrics-endpoint (setting either moves the
            # listener to 127.0.0.1:10300 and pushes data out of the cluster).
            - --disable-log-parsing
            - --disable-pinger
            - --disable-gpu-monitoring
            # NOT --disable-l7-tracing: ip_to_fqdn is built from DNS responses seen by the L7
            # tracer (containers/registry.go EventTypeL7Request), so disabling it empties the
            # FQDN mapping docs/060 §4.6 depends on.
          ports:
            - name: metrics
              containerPort: 80
              protocol: TCP
          securityContext:
            privileged: true
          # Sized from the NM-2 spike (2026-09-24, raspi5 + mba1, docs/060 §6.3): at 384Mi both
          # agents were OOMKilled during the startup scan (working-set peaks 410 / 702 MiB, from
          # parsing the ELF symbols of Go/Rust/OpenSSL binaries for TLS uprobes). At 768Mi both
          # ran 0 restarts; steady working set 320 / 399 MiB (2 h band 313–327 / 370–420) but RSS
          # only 69 / 105 MiB, the rest is reclaimable page cache; CPU 0.02 / 0.05 cores.
          # The 1Gi limit keeps margin above the 702 MiB startup peak; the request covers the
          # steady working set.
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 1Gi
          volumeMounts:
            - name: cgroupfs
              mountPath: /host/sys/fs/cgroup
              readOnly: true
            - name: tracefs
              mountPath: /sys/kernel/tracing
            - name: debugfs
              mountPath: /sys/kernel/debug
            # --wal-dir default; unused without a metrics endpoint but kept writable.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cgroupfs
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        - name: tracefs
          hostPath:
            path: /sys/kernel/tracing
            type: Directory
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
            type: Directory
        - name: tmp
          emptyDir: {}
