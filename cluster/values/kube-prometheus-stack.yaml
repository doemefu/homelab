---
# kube-prometheus-stack Helm Values
# Chart: prometheus-community/kube-prometheus-stack v69.3.1
# Repo:  https://prometheus-community.github.io/helm-charts
#
# grafana.adminPassword: wird von 41_monitoring.yml aus all.sops.yml injiziert — nicht hier hinterlegen
#
# Grafana-Zugriff: ausschliesslich via Cloudflare Tunnel (kein Kubernetes Ingress).
# cloudflared adressiert Grafana cross-namespace via ClusterIP FQDN:
#   http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local:80
# Vorteil: kein cert-manager Zertifikat nötig, keine Traefik-Konfiguration.
#
# Alertmanager: Receiver-Konfiguration via Discord (discord_configs, native AM-Support).
# Die alertmanager.config (route + receiver + inhibit_rules) wird von 41_monitoring.yml
# als values-Override injiziert (alertmanager_discord_webhook_url aus all.sops.yml).
# Vorbedingung: alertmanager_discord_webhook_url in all.sops.yml gesetzt.
#
# Prometheus Storage: 20Gi Longhorn PVC, 14 Tage Retention.
# Longhorn ist Default StorageClass — kein storageClassName Key nötig.
# Hinweis: PVC-Resize nur via kubectl patch möglich (Helm kann StatefulSet-PVCs nicht resizen).
#
# Ressourcen: bewusst konservativ für ARM64 Pi-Hardware (raspi5: 8GB, raspi4: 4GB).
#
# Alert triage (#68): k3s runs kube-controller-manager, kube-scheduler, and kube-proxy
# embedded in the k3s server/agent process, bound to 127.0.0.1 by default (no
# --kube-*-arg bind-address=/metrics-bind-address= flags set anywhere in infra/) — the
# chart's default scrape targets for these 3 components have zero endpoints, so their
# default absent()-based alert rules (KubeControllerManagerDown/KubeSchedulerDown/
# KubeProxyDown) have fired as permanent false positives since install (2026-05-16).
# Disabled both the component scrape config and the matching alert rule groups below
# (values-only, reversible). Alternative NOT implemented here (needs a k3s server/agent
# config change + restart on raspi5, a cluster mutation out of scope for a values-only
# fix): add --kube-controller-manager-arg bind-address=0.0.0.0,
# --kube-scheduler-arg bind-address=0.0.0.0, --kube-proxy-arg
# metrics-bind-address=0.0.0.0:10249 to k3s server/agent args, then set
# kubeControllerManager.endpoints / kubeScheduler.endpoints to ["192.168.1.61"] (raspi5)
# with https + insecureSkipVerify, and re-enable kubeProxy pointed at the same. See
# DEPLOYMENT.md "Alerting Decisions" for the full writeup.

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: false

defaultRules:
  rules:
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeProxy: false

# NM-3 node-script alerts (docs/060-network-monitoring.md §5.6, homelab#117, PR #132). The
# metrics come from homelab-netmon-collect (role netmon_node) via the node-exporter textfile
# collector, which homelab PR #109 enables. The rules evaluate to nothing until then.
# One map key per producer, each rendering its own PrometheusRule:
#   homelab-backups       PR #109 (backup alerts)
#   homelab-netmon        PR #131 (NM-1, issue #116 — data-service collectors)
#   homelab-netmon-node   PR #132 (NM-3, this block)
#   homelab-netmon-egress PR #133 (NM-2 — coroot-node-agent)
#
# ⚠️ All four PRs create the same top-level key `additionalPrometheusRulesMap` at this exact
# position. Whichever PR merges later must resolve the git conflict by keeping ONE key with
# all entries — never two keys (a duplicate YAML key silently drops one map; yamllint
# key-duplicates catches it).
additionalPrometheusRulesMap:
  homelab-netmon-node:
    groups:
      - name: homelab-netmon-node
        rules:
          # The script runs every minute; 600 s = ten missed runs. A node that has never
          # written the file has no series and does not fire (it is not "expected", §4.6);
          # a broken file shows up as the chart's NodeTextFileCollectorScrapeError.
          - alert: NetmonNodeScriptStale
            expr: time() - homelab_netmon_last_success_timestamp_seconds > 600
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "homelab-netmon-collect on {{ $labels.node }} has not succeeded for more than 10 minutes"
              description: >-
                The LAN metrics file on {{ $labels.node }} is stale, so data-service skips that node
                for the NM-3 snapshots. Check `systemctl status homelab-netmon.service` and
                `journalctl -u homelab-netmon -n 20` on the node; runbook in DEPLOYMENT.md
                "Network monitoring: node LAN metrics (NM-3)".
          # info: routed like everything else, but the chart's InfoInhibitor suppresses info
          # alerts in Discord unless a warning fires in the same namespace (monitoring).
          # It stays visible in Prometheus/Alertmanager.
          - alert: NetmonSeriesTruncated
            expr: homelab_netmon_truncated_series > 0
            for: 30m
            labels:
              severity: info
            annotations:
              summary: "{{ $labels.metric }} on {{ $labels.node }} exceeds the netmon series cap"
              description: >-
                {{ $value }} series of {{ $labels.metric }} on {{ $labels.node }} were summed into
                src_ip="other" because netmon_node_max_series was exceeded. Usually a scan; raise the
                cap in infra/roles/netmon_node/defaults/main.yml only if it persists.

prometheus:
  prometheusSpec:
    # arm64-only is intentional, not a resource-sizing constraint:
    # when Prometheus' Longhorn PVC follows the pod onto an MBA (amd64) node it
    # triggers a Longhorn Multi-Attach deadlock on subsequent rescheduling. Pinning
    # to the arm64 Pis (raspi5 + raspi4) keeps the PVC stable. Trade-off: if both
    # Pis are simultaneously Unschedulable, Prometheus stays Pending.
    # See commit d51b6c6 for the original incident.
    nodeSelector:
      kubernetes.io/arch: arm64
    retention: 14d
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
    resources:
      requests:
        cpu: 200m
        memory: 400Mi
      limits:
        cpu: 1000m
        memory: 1Gi

grafana:
  enabled: true
  # adminPassword: wird von 41_monitoring.yml injiziert (SOPS: grafana_admin_password)
  ingress:
    enabled: false  # Zugriff ausschliesslich via Cloudflare Tunnel
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  persistence:
    enabled: true
    type: pvc       # Explizit: verhindert silent emptyDir-Fallback
    size: 1Gi
    # storageClassName omitted → verwendet Longhorn (Default StorageClass)

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

nodeExporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

kubeStateMetrics:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

prometheusOperator:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
