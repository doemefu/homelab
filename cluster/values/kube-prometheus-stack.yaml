---
# kube-prometheus-stack Helm Values
# Chart: prometheus-community/kube-prometheus-stack v69.3.1
# Repo:  https://prometheus-community.github.io/helm-charts
#
# grafana.adminPassword: wird von 41_monitoring.yml aus all.sops.yml injiziert — nicht hier hinterlegen
#
# Grafana-Zugriff: ausschliesslich via Cloudflare Tunnel (kein Kubernetes Ingress).
# cloudflared adressiert Grafana cross-namespace via ClusterIP FQDN:
#   http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local:80
# Vorteil: kein cert-manager Zertifikat nötig, keine Traefik-Konfiguration.
#
# Alertmanager: Receiver-Konfiguration via Discord (discord_configs, native AM-Support).
# Die alertmanager.config (route + receiver + inhibit_rules) wird von 41_monitoring.yml
# als values-Override injiziert (alertmanager_discord_webhook_url aus all.sops.yml).
# Vorbedingung: alertmanager_discord_webhook_url in all.sops.yml gesetzt.
#
# Prometheus Storage: 20Gi Longhorn PVC, 14 Tage Retention.
# Longhorn ist Default StorageClass — kein storageClassName Key nötig.
# Hinweis: PVC-Resize nur via kubectl patch möglich (Helm kann StatefulSet-PVCs nicht resizen).
#
# Ressourcen: bewusst konservativ für ARM64 Pi-Hardware (raspi5: 8GB, raspi4: 4GB).
#
# Alert triage (#68): k3s runs kube-controller-manager, kube-scheduler, and kube-proxy
# embedded in the k3s server/agent process, bound to 127.0.0.1 by default (no
# --kube-*-arg bind-address=/metrics-bind-address= flags set anywhere in infra/) — the
# chart's default scrape targets for these 3 components have zero endpoints, so their
# default absent()-based alert rules (KubeControllerManagerDown/KubeSchedulerDown/
# KubeProxyDown) have fired as permanent false positives since install (2026-05-16).
# Disabled both the component scrape config and the matching alert rule groups below
# (values-only, reversible). Alternative NOT implemented here (needs a k3s server/agent
# config change + restart on raspi5, a cluster mutation out of scope for a values-only
# fix): add --kube-controller-manager-arg bind-address=0.0.0.0,
# --kube-scheduler-arg bind-address=0.0.0.0, --kube-proxy-arg
# metrics-bind-address=0.0.0.0:10249 to k3s server/agent args, then set
# kubeControllerManager.endpoints / kubeScheduler.endpoints to ["192.168.1.61"] (raspi5)
# with https + insecureSkipVerify, and re-enable kubeProxy pointed at the same. See
# DEPLOYMENT.md "Alerting Decisions" for the full writeup.

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: false

defaultRules:
  rules:
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeProxy: false

# Backup alerting (#92). Two backup mechanisms run on/inside the cluster and neither
# was observable before: the Longhorn RecurringJobs in longhorn-system and the restic
# cron (03:00) on raspi5. The Mac-side app-data dumps (scripts/backup-app-data.sh) are
# deliberately NOT covered — the Mac is not a cluster node and any automatic signal
# would need a new component (see DEPLOYMENT.md "Backup alerting (#92)").
#
# A *failed* Longhorn recurring-job run is already caught by the chart's own
# KubeJobFailed (kube_job_failed{namespace=~".*"} > 0, for 15m, warning), which routes
# to the same Discord receiver — no duplicate rule is added here on purpose. Do not
# switch that rule off via defaultRules.disabled without replacing the coverage.
#
# All rules are warning severity: the single Alertmanager route (injected by
# 41_monitoring.yml) sends everything to Discord regardless, and the chart's inhibit
# rules only suppress across an equal alertname, so these never mask each other.
additionalPrometheusRulesMap:
  homelab-backups:
    groups:
      - name: homelab-backups
        rules:
          # --- restic on raspi5 ---
          # Metrics are written by homelab-backup.sh (infra/roles/storage) into the
          # node-exporter textfile collector directory configured further down.
          # node-exporter series carry no `nodename` target label (only node_uname_info
          # does), so the node is named literally — restic runs on raspi5 only
          # (storage_run_restic_backup is true for the k3s_server group only).
          - alert: ResticBackupFailed
            expr: homelab_backup_exit_code > 0
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "restic backup on raspi5 failed"
              description: >-
                homelab-backup.sh on raspi5 ({{ $labels.instance }}) exited with code {{ $value }}.
                Inspect `journalctl -t homelab-backup` on raspi5; runbook in DEPLOYMENT.md
                "Backup alerting (#92)". Resolves automatically after the next successful run.
          # 26 h = the 24 h schedule + DST slack (both crons are node-local, so the
          # spring/autumn gaps are 23 h and 25 h) + one evaluation cycle.
          # max() strips every label so the two branches of the `or` share one identity.
          # The absent() branch also covers "the metric never appeared at all".
          # ⚠️ Rollout order matters because of that branch: run 10_base.yml (installs the
          # script + the directory) and then ONE manual `homelab-backup.sh` on raspi5
          # BEFORE running 41_monitoring.yml. Doing it in that order means the .prom file
          # already exists when node-exporter starts reading the directory, so absent() is
          # never true. Applying 41_monitoring.yml first leaves a window that lasts until
          # the next 03:00 cron — up to ~24 h, which `for: 2h` only softens, it does not
          # close. The order is documented in DEPLOYMENT.md "Backup alerting (#92)".
          - alert: ResticBackupStale
            expr: >-
              (time() - max(homelab_backup_last_success_timestamp_seconds) > 26 * 3600)
              or absent(homelab_backup_last_success_timestamp_seconds)
            for: 2h
            labels:
              severity: warning
            annotations:
              summary: "No successful restic backup on raspi5 for more than 26h"
              description: >-
                Either the 03:00 restic cron on raspi5 stopped running, or node-exporter is no
                longer exposing homelab_backup_last_success_timestamp_seconds. Runbook in
                DEPLOYMENT.md "Backup alerting (#92)".
          # --- Longhorn recurring jobs ---
          # Anchored on kube_cronjob_created, NOT on the age of the last success:
          # kube-state-metrics emits kube_cronjob_status_last_successful_time only once
          # .status.lastSuccessfulTime is set, so a job that has never succeeded has no
          # series at all and a plain staleness comparison could never fire for it.
          # The LHS also gives a newly created job a 26 h grace period before it counts.
          # Namespace-wide on purpose: every current and future Longhorn recurring job is
          # covered without editing this rule. No kube-state-metrics-up guard is needed —
          # if kube-state-metrics is down, both operands vanish and the LHS is empty.
          - alert: LonghornRecurringJobNotSucceeding
            expr: >-
              max by (cronjob) (kube_cronjob_created{namespace="longhorn-system"}) < time() - 26 * 3600
              unless
              max by (cronjob) (kube_cronjob_status_last_successful_time{namespace="longhorn-system"} > time() - 26 * 3600)
            for: 1h
            labels:
              severity: warning
            annotations:
              summary: "Longhorn recurring job {{ $labels.cronjob }} has not succeeded for more than 26h"
              description: >-
                The CronJob longhorn-system/{{ $labels.cronjob }} has no successful run in the last
                26 h (or has never succeeded). Check `kubectl -n longhorn-system get cronjobs,jobs`;
                runbook in DEPLOYMENT.md "Backup alerting (#92)".
          # Deleting the last RecurringJob of a Longhorn group makes Longhorn strip the
          # group labels from the PVC and the Volume, so the volume silently falls back to
          # the `default` group (#101). The job object then disappears entirely, which the
          # rule above cannot see, because it has no series left to be stale.
          # Both existing recurring jobs are guarded in one rule: absent() carries the
          # matcher labels, so the `or` union yields at most one series per missing job,
          # each with its own `cronjob` label. Two separately declared rules with the same
          # alertname and the same static labels are rejected by `promtool check rules`
          # as duplicates, even though their firing label sets would differ at runtime.
          # The `and on()` clause suppresses the alert while kube-state-metrics itself is
          # down or rolling — that case is the chart's TargetDown, not a backup problem.
          # metrics-filesystem-trim (#106, PR #107) joins this list once that PR merges.
          - alert: LonghornRecurringJobMissing
            expr: >-
              (absent(kube_cronjob_info{namespace="longhorn-system", cronjob="daily-snapshot"})
              or absent(kube_cronjob_info{namespace="longhorn-system", cronjob="metrics-snapshot-cleanup"}))
              and on() (count(up{job="kube-state-metrics"} == 1) > 0)
            for: 1h
            labels:
              severity: warning
            annotations:
              summary: "Longhorn recurring job {{ $labels.cronjob }} no longer exists"
              description: >-
                The CronJob longhorn-system/{{ $labels.cronjob }} is gone, so whatever it covered
                has stopped. Longhorn also strips a group's labels from the PVC and the Volume when
                that group's last job is deleted, which drops the Prometheus TSDB volume back into
                the `default` snapshot group and can repeat the #101 disk-pressure incident.
                Re-apply infra/playbooks/30_longhorn.yml; runbook in DEPLOYMENT.md
                "Backup alerting (#92)".

prometheus:
  prometheusSpec:
    # arm64-only is intentional, not a resource-sizing constraint:
    # when Prometheus' Longhorn PVC follows the pod onto an MBA (amd64) node it
    # triggers a Longhorn Multi-Attach deadlock on subsequent rescheduling. Pinning
    # to the arm64 Pis (raspi5 + raspi4) keeps the PVC stable. Trade-off: if both
    # Pis are simultaneously Unschedulable, Prometheus stays Pending.
    # See commit d51b6c6 for the original incident.
    nodeSelector:
      kubernetes.io/arch: arm64
    retention: 14d
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
    resources:
      requests:
        cpu: 200m
        memory: 400Mi
      limits:
        cpu: 1000m
        memory: 1Gi

grafana:
  enabled: true
  # adminPassword: wird von 41_monitoring.yml injiziert (SOPS: grafana_admin_password)
  ingress:
    enabled: false  # Zugriff ausschliesslich via Cloudflare Tunnel
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  persistence:
    enabled: true
    type: pvc       # Explizit: verhindert silent emptyDir-Fallback
    size: 1Gi
    # storageClassName omitted → verwendet Longhorn (Default StorageClass)

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

nodeExporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# node-exporter subchart values (alias `prometheus-node-exporter`, version 4.43.*).
# Textfile collector for the restic backup metrics (#92): homelab-backup.sh on raspi5
# writes homelab-backup.prom into the host directory below, node-exporter reads it
# read-only. The path is the other half of a contract with
# `storage_textfile_collector_dir` in infra/roles/storage/defaults/main.yml — change
# both or the metric disappears and ResticBackupStale fires.
#
# ⚠️ extraArgs is a list, and Helm replaces lists wholesale: the two
# --collector.filesystem.*-exclude values below are the chart's own defaults and MUST
# stay here verbatim. Dropping them makes node-exporter report every docker/kubelet
# bind mount as a filesystem and the NodeFilesystem* alerts turn noisy.
#
# hostPath type DirectoryOrCreate makes kubelet create the directory on every node, not
# just on raspi5 — node-exporter sets node_textfile_scrape_error=1 (alert
# NodeTextFileCollectorScrapeError) when the configured directory cannot be read.
# The storage role creates the same directory via Ansible as well.
prometheus-node-exporter:
  extraArgs:
    # yamllint disable-line rule:line-length
    - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
    # yamllint disable-line rule:line-length
    - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$
    - --collector.textfile.directory=/var/lib/node_exporter/textfile_collector
  extraHostVolumeMounts:
    - name: textfile-collector
      hostPath: /var/lib/node_exporter/textfile_collector
      type: DirectoryOrCreate
      mountPath: /var/lib/node_exporter/textfile_collector
      readOnly: true

kubeStateMetrics:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

prometheusOperator:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# --- Network monitoring: coroot-node-agent egress rules (NM-2, #118) ---
# Contract: docs/060-network-monitoring.md §6.4. Own map key so the NM-1 (`homelab-netmon`),
# NM-3 (`homelab-netmon-node`) and #109 (`homelab-backups`) rule groups never collide; when two
# of these PRs both add the top-level `additionalPrometheusRulesMap:` key, merge them into ONE
# map (a second top-level key would silently replace the first on YAML load).
additionalPrometheusRulesMap:
  homelab-netmon-egress:
    groups:
      - name: homelab-netmon-egress
        # 5m instead of the global 30s: the 1d last_over_time over every connect series is the
        # most expensive query here, and a 15-minute alert window does not need 30s resolution.
        interval: 5m
        rules:
          # Series presence, not increase() > 0: a brand-new destination's counter has a single
          # sample in a short window, so increase() would miss exactly the case this alert is for.
          # `workload` = container_id with the Deployment/DaemonSet/Job pod-name suffix removed
          # (/k8s/<ns>/<pod>/<container> -> <ns>/<owner>/<container>). Without it every Flux
          # rollout (new pod name -> new container_id) would re-report all of a workload's known
          # destinations. Pods that do not match (StatefulSets, systemd units) keep the raw
          # container_id. The destination filter drops pod/service CIDRs, LAN and loopback.
          # severity info: the chart's InfoInhibitor normally suppresses info alerts in
          # Alertmanager unless a warning/critical fires in the same namespace (here: monitoring),
          # so this normally shows in the Alertmanager and Prometheus UIs without paging Discord
          # (docs/060 §6.4).
          - alert: NetmonNewExternalDestination
            expr: |
              count by (workload) (
                group by (workload, actual_destination) (
                  label_replace(
                    label_replace(
                      container_net_tcp_successful_connects_total{actual_destination!~"(10\\.4[23]\\.|192\\.168\\.|127\\.).*"},
                      "workload", "$1", "container_id", "(.*)"),
                    "workload", "$1/$2/$3", "container_id",
                    "/k8s/([^/]+)/(.+?)(?:-[bcdfghjklmnpqrstvwxz2456789]{6,10})?-[bcdfghjklmnpqrstvwxz2456789]{5}/(.+)")
                )
                unless on (workload, actual_destination)
                group by (workload, actual_destination) (
                  label_replace(
                    label_replace(
                      last_over_time(container_net_tcp_successful_connects_total[1d] offset 15m),
                      "workload", "$1", "container_id", "(.*)"),
                    "workload", "$1/$2/$3", "container_id",
                    "/k8s/([^/]+)/(.+?)(?:-[bcdfghjklmnpqrstvwxz2456789]{6,10})?-[bcdfghjklmnpqrstvwxz2456789]{5}/(.+)")
                )
              )
            for: 0m
            labels:
              severity: info
              namespace: monitoring
            annotations:
              summary: "{{ $labels.workload }} connected to {{ $value }} new external destination(s)"
              description: >-
                {{ $labels.workload }} opened TCP connections to {{ $value }} external ip:port
                destination(s) not seen in the previous 24 h. Details:
                container_net_tcp_successful_connects_total in Prometheus or the egress section of
                /dashboard/network. Expected to be noisy for CDN-rotating destinations.
          # Up/scrape health that the chart does not already cover. Pod crash loops, rollout
          # stalls and unscheduled pods are the chart's KubePodCrashLooping /
          # KubeDaemonSetRolloutStuck / KubeDaemonSetNotScheduled; a failing scrape of a
          # running pod (e.g. sampleLimit exceeded) is also the chart's TargetDown.
          # Branch 1: the DaemonSet is gone. Branch 2: more agents are available than are
          # scraped successfully (Service/ServiceMonitor missing, selector drift, sampleLimit).
          # With the spike gate closed (no labelled node) both sides are 0 and nothing fires.
          # Also fires while kube-state-metrics is down (the absent() branch).
          - alert: CorootNodeAgentDown
            expr: |
              absent(kube_daemonset_status_desired_number_scheduled{namespace="monitoring", daemonset="coroot-node-agent"})
              or
              max(kube_daemonset_status_number_available{namespace="monitoring", daemonset="coroot-node-agent"})
                > (count(up{job="coroot-node-agent"} == 1) or vector(0))
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "coroot-node-agent is missing or not scraped"
              description: >-
                Either DaemonSet monitoring/coroot-node-agent does not exist, or fewer agent pods
                are scraped successfully than are available (check the ServiceMonitor, the headless
                Service and scrape_samples_post_metric_relabeling against sampleLimit 10000). The
                absent() branch also fires while kube-state-metrics itself is down. Runbook:
                DEPLOYMENT.md "coroot-node-agent (NM-2)".
