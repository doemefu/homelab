# promtool unit tests for WebAnalyticsIngestSilent and its latch recording rule
# webanalytics:accepted:last_seen_timestamp (docs/100-web-analytics.md §7.9, homelab#352, WA-6).
# Run: scripts/promtool-test-rules.sh (CI: `Test Prometheus Rules`). Counter samples and rule evaluations are
# 15 minutes apart: the longest scenario spans 44 days, and a 15 minute grid keeps every range under promtool's
# 10 000 sample cap. The alert holds 1 hour (`for: 1h`), so a threshold crossing is pending for 4 evaluations
# before it fires; the checkpoints sit one evaluation before and at the first firing evaluation.
# time() starts at 0 in promtool: latch values are seconds since the start of the test.
rule_files:
  - rules.yaml
evaluation_interval: 15m
tests:
  # Dark: the accepted counter is flat at 0 for 25 days (feature dark, before go-live): silent at every checkpoint and the latch series does not exist.
  - interval: 15m
    input_series:
      - series: "webanalytics_events_accepted_total"
        values: "0 0x2399"
      - series: "kube_deployment_status_replicas_available{namespace=\"apps\", deployment=\"data-service\"}"
        values: "1x4600"
      - series: "kube_deployment_status_replicas_available{namespace=\"apps\", deployment=\"furchert-ch\"}"
        values: "1x4600"
    promql_expr_test:
      - expr: webanalytics:accepted:last_seen_timestamp
        eval_time: 34560m
        exp_samples: []
    alert_rule_test:
      - eval_time: 7200m
        alertname: WebAnalyticsIngestSilent
        exp_alerts: []
      - eval_time: 21600m
        alertname: WebAnalyticsIngestSilent
        exp_alerts: []
      - eval_time: 34560m
        alertname: WebAnalyticsIngestSilent
        exp_alerts: []
  # Before and after go-live: 14 days of 0, then 96 events per day: silent before and after; the latch then follows the last busy hour.
  - interval: 15m
    input_series:
      - series: "webanalytics_events_accepted_total"
        values: "0 0x1343 1+1x1055"
      - series: "kube_deployment_status_replicas_available{namespace=\"apps\", deployment=\"data-service\"}"
        values: "1x4600"
      - series: "kube_deployment_status_replicas_available{namespace=\"apps\", deployment=\"furchert-ch\"}"
        values: "1x4600"
    promql_expr_test:
      - expr: webanalytics:accepted:last_seen_timestamp
        eval_time: 34560m
        exp_samples:
          - labels: "webanalytics:accepted:last_seen_timestamp"
            value: 2073600
    alert_rule_test:
      - eval_time: 14400m
        alertname: WebAnalyticsIngestSilent
        exp_alerts: []
      - eval_time: 23040m
        alertname: WebAnalyticsIngestSilent
        exp_alerts: []
      - eval_time: 34560m
        alertname: WebAnalyticsIngestSilent
        exp_alerts: []
  # Quiet nights: 12 hours of traffic and 12 hours of silence every day for 21 days (a night is far below 24 hours): silent.
  - interval: 15m
    input_series:
      - series: "webanalytics_events_accepted_total"
        values: "0 2+2x47 96x47 98+2x47 192x47 194+2x47 288x47 290+2x47 384x47 386+2x47 480x47 482+2x47 576x47 578+2x47 672x47 674+2x47 768x47 770+2x47 864x47 866+2x47 960x47 962+2x47 1056x47 1058+2x47 1152x47 1154+2x47 1248x47 1250+2x47 1344x47 1346+2x47 1440x47 1442+2x47 1536x47 1538+2x47 1632x47 1634+2x47 1728x47 1730+2x47 1824x47 1826+2x47 1920x47 1922+2x47 2016x47"
      - series: "kube_deployment_status_replicas_available{namespace=\"apps\", deployment=\"data-service\"}"
        values: "1x4600"
      - series: "kube_deployment_status_replicas_available{namespace=\"apps\", deployment=\"furchert-ch\"}"
        values: "1x4600"
    alert_rule_test:
      - eval_time: 12960m
        alertname: WebAnalyticsIngestSilent
        exp_alerts: []
      - eval_time: 21780m
        alertname: WebAnalyticsIngestSilent
        exp_alerts: []
      - eval_time: 29460m
        alertname: WebAnalyticsIngestSilent
        exp_alerts: []
  # Slow baseline (10 events per day) then silence: no fast path; the 7 day rule goes pending at 21d1h, silent at 21d1h45m, firing at 21d2h, and it keeps firing after 30 days of silence (the latch holds).
  - interval: 15m
    input_series:
      - series: "webanalytics_events_accepted_total"
        values: "0 0.1041667+0.1041667x1343 140x2879"
      - series: "kube_deployment_status_replicas_available{namespace=\"apps\", deployment=\"data-service\"}"
        values: "1x4600"
      - series: "kube_deployment_status_replicas_available{namespace=\"apps\", deployment=\"furchert-ch\"}"
        values: "1x4600"
    promql_expr_test:
      - expr: "ALERTS{alertname=\"WebAnalyticsIngestSilent\", alertstate=\"pending\"}"
        eval_time: 30300m
        exp_samples:
          - labels: "ALERTS{alertname=\"WebAnalyticsIngestSilent\", alertstate=\"pending\", severity=\"info\", namespace=\"apps\"}"
            value: 1
    alert_rule_test:
      - eval_time: 28800m
        alertname: WebAnalyticsIngestSilent
        exp_alerts: []
      - eval_time: 30345m
        alertname: WebAnalyticsIngestSilent
        exp_alerts: []
      - eval_time: 30360m
        alertname: WebAnalyticsIngestSilent
        exp_alerts:
          - exp_labels:
              severity: "info"
              namespace: "apps"
            exp_annotations:
              summary: "No web analytics events were accepted for 7 days (24 hours after a busy week)"
              description: "data-service has accepted no analytics event for 7 days, or for 24 hours after a week that averaged at least 50 events per day, although data-service and furchert-ch are up. Check the furchert-ch collect route and the ANALYTICS_* flags, the tracker (consent bar and bundle), the forward queue and token, and data-service (GET /api/webanalytics/status, caps, rejects). Enquiries do not count. A planned stop (kill switch, caps 0) also fires it: silence it for the duration. Spec: docs/100-web-analytics.md §7.9; first checks in DEPLOYMENT.md \"Web analytics (WA-5): alerts, Cloudflare rules and owner checks\"."
      - eval_time: 43200m
        alertname: WebAnalyticsIngestSilent
        exp_alerts:
          - exp_labels:
              severity: "info"
              namespace: "apps"
            exp_annotations:
              summary: "No web analytics events were accepted for 7 days (24 hours after a busy week)"
              description: "data-service has accepted no analytics event for 7 days, or for 24 hours after a week that averaged at least 50 events per day, although data-service and furchert-ch are up. Check the furchert-ch collect route and the ANALYTICS_* flags, the tracker (consent bar and bundle), the forward queue and token, and data-service (GET /api/webanalytics/status, caps, rejects). Enquiries do not count. A planned stop (kill switch, caps 0) also fires it: silence it for the duration. Spec: docs/100-web-analytics.md §7.9; first checks in DEPLOYMENT.md \"Web analytics (WA-5): alerts, Cloudflare rules and owner checks\"."
      - eval_time: 62640m
        alertname: WebAnalyticsIngestSilent
        exp_alerts:
          - exp_labels:
              severity: "info"
              namespace: "apps"
            exp_annotations:
              summary: "No web analytics events were accepted for 7 days (24 hours after a busy week)"
              description: "data-service has accepted no analytics event for 7 days, or for 24 hours after a week that averaged at least 50 events per day, although data-service and furchert-ch are up. Check the furchert-ch collect route and the ANALYTICS_* flags, the tracker (consent bar and bundle), the forward queue and token, and data-service (GET /api/webanalytics/status, caps, rejects). Enquiries do not count. A planned stop (kill switch, caps 0) also fires it: silence it for the duration. Spec: docs/100-web-analytics.md §7.9; first checks in DEPLOYMENT.md \"Web analytics (WA-5): alerts, Cloudflare rules and owner checks\"."
  # Busy baseline (96 events per day for 14 days) then silence: the 24 hour fast path is silent at 15d1h30m and firing at 15d1h45m.
  - interval: 15m
    input_series:
      - series: "webanalytics_events_accepted_total"
        values: "0 1+1x1343 1344x1919"
      - series: "kube_deployment_status_replicas_available{namespace=\"apps\", deployment=\"data-service\"}"
        values: "1x4600"
      - series: "kube_deployment_status_replicas_available{namespace=\"apps\", deployment=\"furchert-ch\"}"
        values: "1x4600"
    alert_rule_test:
      - eval_time: 21480m
        alertname: WebAnalyticsIngestSilent
        exp_alerts: []
      - eval_time: 21690m
        alertname: WebAnalyticsIngestSilent
        exp_alerts: []
      - eval_time: 21705m
        alertname: WebAnalyticsIngestSilent
        exp_alerts:
          - exp_labels:
              severity: "info"
              namespace: "apps"
            exp_annotations:
              summary: "No web analytics events were accepted for 7 days (24 hours after a busy week)"
              description: "data-service has accepted no analytics event for 7 days, or for 24 hours after a week that averaged at least 50 events per day, although data-service and furchert-ch are up. Check the furchert-ch collect route and the ANALYTICS_* flags, the tracker (consent bar and bundle), the forward queue and token, and data-service (GET /api/webanalytics/status, caps, rejects). Enquiries do not count. A planned stop (kill switch, caps 0) also fires it: silence it for the duration. Spec: docs/100-web-analytics.md §7.9; first checks in DEPLOYMENT.md \"Web analytics (WA-5): alerts, Cloudflare rules and owner checks\"."
      - eval_time: 25920m
        alertname: WebAnalyticsIngestSilent
        exp_alerts:
          - exp_labels:
              severity: "info"
              namespace: "apps"
            exp_annotations:
              summary: "No web analytics events were accepted for 7 days (24 hours after a busy week)"
              description: "data-service has accepted no analytics event for 7 days, or for 24 hours after a week that averaged at least 50 events per day, although data-service and furchert-ch are up. Check the furchert-ch collect route and the ANALYTICS_* flags, the tracker (consent bar and bundle), the forward queue and token, and data-service (GET /api/webanalytics/status, caps, rejects). Enquiries do not count. A planned stop (kill switch, caps 0) also fires it: silence it for the duration. Spec: docs/100-web-analytics.md §7.9; first checks in DEPLOYMENT.md \"Web analytics (WA-5): alerts, Cloudflare rules and owner checks\"."
  # Enquiries do not count: the accepted counter is silent after a busy baseline while webanalytics_enquiries_total keeps increasing: fires as without them.
  - interval: 15m
    input_series:
      - series: "webanalytics_events_accepted_total"
        values: "0 1+1x1343 1344x1919"
      - series: "webanalytics_enquiries_total"
        values: "0 0.05+0.05x3263"
      - series: "kube_deployment_status_replicas_available{namespace=\"apps\", deployment=\"data-service\"}"
        values: "1x4600"
      - series: "kube_deployment_status_replicas_available{namespace=\"apps\", deployment=\"furchert-ch\"}"
        values: "1x4600"
    alert_rule_test:
      - eval_time: 21690m
        alertname: WebAnalyticsIngestSilent
        exp_alerts: []
      - eval_time: 21705m
        alertname: WebAnalyticsIngestSilent
        exp_alerts:
          - exp_labels:
              severity: "info"
              namespace: "apps"
            exp_annotations:
              summary: "No web analytics events were accepted for 7 days (24 hours after a busy week)"
              description: "data-service has accepted no analytics event for 7 days, or for 24 hours after a week that averaged at least 50 events per day, although data-service and furchert-ch are up. Check the furchert-ch collect route and the ANALYTICS_* flags, the tracker (consent bar and bundle), the forward queue and token, and data-service (GET /api/webanalytics/status, caps, rejects). Enquiries do not count. A planned stop (kill switch, caps 0) also fires it: silence it for the duration. Spec: docs/100-web-analytics.md §7.9; first checks in DEPLOYMENT.md \"Web analytics (WA-5): alerts, Cloudflare rules and owner checks\"."
  # Pod replacement: the old series ends with a stale marker, the new series starts from 0 with one overlapping hour while traffic continues: no silent gap, no alert.
  - interval: 15m
    input_series:
      - series: "webanalytics_events_accepted_total{pod=\"a\"}"
        values: "0 1+1x1343 stale"
      - series: "webanalytics_events_accepted_total{pod=\"b\"}"
        values: "0 _x1339 1+1x1059"
      - series: "kube_deployment_status_replicas_available{namespace=\"apps\", deployment=\"data-service\"}"
        values: "1x4600"
      - series: "kube_deployment_status_replicas_available{namespace=\"apps\", deployment=\"furchert-ch\"}"
        values: "1x4600"
    alert_rule_test:
      - eval_time: 20100m
        alertname: WebAnalyticsIngestSilent
        exp_alerts: []
      - eval_time: 20340m
        alertname: WebAnalyticsIngestSilent
        exp_alerts: []
      - eval_time: 23040m
        alertname: WebAnalyticsIngestSilent
        exp_alerts: []
      - eval_time: 34560m
        alertname: WebAnalyticsIngestSilent
        exp_alerts: []
  # Latch gap: a 6 hour gap in the counter samples in the middle of busy traffic, then traffic again: silent throughout.
  - interval: 15m
    input_series:
      - series: "webanalytics_events_accepted_total"
        values: "0 1+1x959 _x23 961+1x959"
      - series: "kube_deployment_status_replicas_available{namespace=\"apps\", deployment=\"data-service\"}"
        values: "1x4600"
      - series: "kube_deployment_status_replicas_available{namespace=\"apps\", deployment=\"furchert-ch\"}"
        values: "1x4600"
    alert_rule_test:
      - eval_time: 14700m
        alertname: WebAnalyticsIngestSilent
        exp_alerts: []
      - eval_time: 14880m
        alertname: WebAnalyticsIngestSilent
        exp_alerts: []
      - eval_time: 20160m
        alertname: WebAnalyticsIngestSilent
        exp_alerts: []
  # Data-service is down during the silence: the alert is silent (the availability alerts cover the outage).
  - interval: 15m
    input_series:
      - series: "webanalytics_events_accepted_total"
        values: "0 1+1x1343 1344x1919"
      - series: "kube_deployment_status_replicas_available{namespace=\"apps\", deployment=\"data-service\"}"
        values: "1x1344 0x4600"
      - series: "kube_deployment_status_replicas_available{namespace=\"apps\", deployment=\"furchert-ch\"}"
        values: "1x4600"
    alert_rule_test:
      - eval_time: 21720m
        alertname: WebAnalyticsIngestSilent
        exp_alerts: []
      - eval_time: 25920m
        alertname: WebAnalyticsIngestSilent
        exp_alerts: []
  # Furchert-ch is down during the silence: the alert is silent.
  - interval: 15m
    input_series:
      - series: "webanalytics_events_accepted_total"
        values: "0 1+1x1343 1344x1919"
      - series: "kube_deployment_status_replicas_available{namespace=\"apps\", deployment=\"data-service\"}"
        values: "1x4600"
      - series: "kube_deployment_status_replicas_available{namespace=\"apps\", deployment=\"furchert-ch\"}"
        values: "1x1344 0x4600"
    alert_rule_test:
      - eval_time: 21720m
        alertname: WebAnalyticsIngestSilent
        exp_alerts: []
      - eval_time: 25920m
        alertname: WebAnalyticsIngestSilent
        exp_alerts: []
  # Counter reset during the silence (pod restart): the reset is no new event, the alert still fires.
  - interval: 15m
    input_series:
      - series: "webanalytics_events_accepted_total"
        values: "0 1+1x1343 1344x11 0 0x1919"
      - series: "kube_deployment_status_replicas_available{namespace=\"apps\", deployment=\"data-service\"}"
        values: "1x4600"
      - series: "kube_deployment_status_replicas_available{namespace=\"apps\", deployment=\"furchert-ch\"}"
        values: "1x4600"
    alert_rule_test:
      - eval_time: 21690m
        alertname: WebAnalyticsIngestSilent
        exp_alerts: []
      - eval_time: 21840m
        alertname: WebAnalyticsIngestSilent
        exp_alerts:
          - exp_labels:
              severity: "info"
              namespace: "apps"
            exp_annotations:
              summary: "No web analytics events were accepted for 7 days (24 hours after a busy week)"
              description: "data-service has accepted no analytics event for 7 days, or for 24 hours after a week that averaged at least 50 events per day, although data-service and furchert-ch are up. Check the furchert-ch collect route and the ANALYTICS_* flags, the tracker (consent bar and bundle), the forward queue and token, and data-service (GET /api/webanalytics/status, caps, rejects). Enquiries do not count. A planned stop (kill switch, caps 0) also fires it: silence it for the duration. Spec: docs/100-web-analytics.md §7.9; first checks in DEPLOYMENT.md \"Web analytics (WA-5): alerts, Cloudflare rules and owner checks\"."
