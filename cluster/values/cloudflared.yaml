---
# cloudflared Helm Values
# Chart: cloudflare/cloudflare-tunnel-remote 0.1.2
# Image: cloudflare/cloudflared 2026.8.2 (2026-08-14, amd64+arm64). Chart 0.1.2 is still the latest
# (index checked 2026-08-28). 2026.8.0-.2 = HTTP path-normalization security fixes; since 2026.4.0
# --edge-ip-version defaults to auto (chart exposes no extraArgs to pin it).
# Repo:  https://cloudflare.github.io/helm-charts
#
# Digest pin (#57): the chart template does `image: "{{ .Values.image.repository }}:
# {{ .Values.image.tag | default "latest" }}"` (plain string concat, no dedicated
# image.digest value in this chart's values.yaml as of 0.1.2 — confirmed via `helm show
# values`) — so the digest is appended directly to image.tag below (valid `name:tag@digest`
# OCI reference form; the digest takes precedence for the actual pull, the tag stays
# informational). Never leave image.tag empty — the template's `| default "latest"`
# fallback would silently pull `:latest`. Multi-arch index digest resolved 2026-09-04 via
# `docker buildx imagetools inspect`.
# Do not add `image:` to the inline `values:` block in 40_platform.yml's Helm task — it
# would override this pin (that block currently only sets the tunnel token).
#
# tunnelToken: wird von 40_platform.yml aus all.sops.yml injiziert — nicht hier hinterlegen
#
# Ingress-Regeln: werden via Cloudflare API gesetzt (40_platform.yml, uri-Task PUT)
# Hintergrund: cloudflare-tunnel-remote 0.1.2 nutzt token-basiertes Setup ("locally configured
# tunnel") — Ingress kann nicht via Helm Values gesteuert werden, nur via API.
#
# Aktuelle Ingress-Regeln (Single Source of Truth: infra/playbooks/40_platform.yml):
#   - hostname: ssh.furchert.ch     → ssh://192.168.1.61:22  (raspi5 SSH)
#   - hostname: grafana.furchert.ch → http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local:80
#   - hostname: auth.furchert.ch    → http://auth-service.apps.svc.cluster.local:8080
#   - hostname: device.furchert.ch  → http://device-service.apps.svc.cluster.local:8081
#   - hostname: n8n.furchert.ch     → http://n8n.apps.svc.cluster.local:80
#   - hostname: ai.furchert.ch      → http://litellm.apps.svc.cluster.local:4000
#   - service:  http_status:404     (Fallback — alle anderen Anfragen)
# Bei Drift: 40_platform.yml ist authoritativ — diesen Kommentar entsprechend nachziehen.
#
# Neuen Service hinzufügen: Ingress-Liste in 40_platform.yml ergänzen,
# dann ansible-playbook infra/playbooks/40_platform.yml ausführen.
#
# Sicherheitsprinzip: alles was nicht explizit gelistet ist → 404, nie → Traefik

image:
  tag: "2026.8.2@sha256:0aa26e284f05e6c77ae375b8c9c11d9eb6a448fb7bcd8d40f31cb6176189eb38"  # pinned — never latest

replicaCount: 1

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi
