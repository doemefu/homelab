apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: apps
  labels:
    app: n8n
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: n8n
          # Pinned 2.37.10 = the version running live since 2026-09-06 (PR #87, playbook 52 run that
          # day). Multi-arch OCI index digest re-verified 2026-10-14 against registry-1.docker.io
          # (linux/amd64 + linux/arm64). Held back on purpose: Dependabot bumps to 2.39.7/2.40.5/2.42.3
          # were merged but never applied, so a routine 52 run would have upgraded n8n by five minors.
          # The club-assistant workflows are verified on 2.37.10 only; an upgrade is its own planned
          # change (PVC backup, club re-tests) — see DEPLOYMENT.md "n8n → Upgrade". This is an interim
          # pin: 2.37.10 is affected by the 2026-09-16 and 2026-09-30 n8n advisory batches (fixed in
          # 2.39.6/2.40.1 and 2.41.4/2.42.1, e.g. GHSA-728h-pmr2-7cgh, GHSA-597w-c3jh-g8fg,
          # GHSA-9rhv-fhr8-7q5r); planned target 2.42.7 in an agreed window. SQLite migrations
          # are forward-only: never point an older image at a PVC a newer image has migrated.
          image: n8nio/n8n:2.37.10@sha256:307d6065be25619aa24cfc63a7c2f04ca56d084a08c05c8e9f189a89f353b1ec
          ports:
            - containerPort: 5678
          env:
            - name: N8N_PORT
              value: "5678"
            - name: GENERIC_TIMEZONE
              value: "Europe/Zurich"
            - name: TZ
              value: "Europe/Zurich"
            - name: N8N_BASIC_AUTH_ACTIVE
              value: "false"
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: n8n-secrets
                  key: encryption-key
            - name: N8N_HOST
              value: "n8n.furchert.ch"
            - name: N8N_PROTOCOL
              value: "https"
            # Behind the Cloudflare Tunnel + Traefik, n8n is reached on the
            # standard HTTPS port. Set these explicitly so the OAuth callback
            # URL is built from the public host, not from N8N_PORT (avoids :5678).
            - name: WEBHOOK_URL
              value: "https://n8n.furchert.ch/"
            - name: N8N_EDITOR_BASE_URL
              value: "https://n8n.furchert.ch/"
            - name: N8N_PROXY_HOPS
              value: "1"
            - name: N8N_SSO_MANAGED_BY_ENV
              value: "true"
            - name: N8N_SSO_OIDC_LOGIN_ENABLED
              value: "true"
            - name: N8N_SSO_OIDC_CLIENT_ID
              value: "n8n"
            - name: N8N_SSO_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: homelab-auth-secrets
                  key: n8n-client-secret
            - name: N8N_SSO_OIDC_DISCOVERY_ENDPOINT
              value: "https://auth.furchert.ch/.well-known/openid-configuration"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5678
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5678
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # startupProbe budget ≈ 10 min: the 727 MB SQLite DB must run ~15 migrations on
          # first boot of 2.36.8; liveness must not kill the pod mid-migration.
          startupProbe:
            httpGet:
              path: /healthz
              port: 5678
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 59
          volumeMounts:
            - name: n8n-data
              mountPath: /home/node/.n8n
          resources:
            requests:
              cpu: 100m
              # Raised 256Mi -> 768Mi (2026-09-03): measured working set ~450-590 MiB, so the pod ran
              # far above its request and was the first eviction candidate under node pressure. #74
              memory: 768Mi
            limits:
              cpu: 1000m
              # Raised 1Gi -> 2Gi (2026-09-03): OOMKilled twice loading the n8n-backup workflow's
              # execution data (baseline ~450-590 MiB, spike past 1Gi within one 15 s scrape). #72
              memory: 2Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
      volumes:
        - name: n8n-data
          persistentVolumeClaim:
            claimName: n8n-data
