apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: apps
  labels:
    app: n8n
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: n8n
          # Pinned 2.46.4 (Dependabot PR #330, merged 2026-11-06). Multi-arch OCI index digest verified
          # 2026-11-06 against registry-1.docker.io (linux/amd64 + linux/arm64). Fixes the 2026-10-28 n8n
          # advisory batch. An image change is its own planned rollout: playbook 52 refuses it without
          # n8n_image_change_ack (PVC backup first, club re-tests) — see DEPLOYMENT.md "n8n → Upgrade".
          # SQLite migrations are forward-only (2.46 adds two irreversible ones): never point an older
          # image at a PVC a newer image has migrated.
          image: n8nio/n8n:2.47.3@sha256:6723b440354bb8e1395a1ecee12685fe03923f897bf6e4d5bb2c6c2bd2051697
          ports:
            - containerPort: 5678
          env:
            - name: N8N_PORT
              value: "5678"
            - name: GENERIC_TIMEZONE
              value: "Europe/Zurich"
            - name: TZ
              value: "Europe/Zurich"
            - name: N8N_BASIC_AUTH_ACTIVE
              value: "false"
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: n8n-secrets
                  key: encryption-key
            - name: N8N_HOST
              value: "n8n.furchert.ch"
            - name: N8N_PROTOCOL
              value: "https"
            # Behind the Cloudflare Tunnel + Traefik, n8n is reached on the
            # standard HTTPS port. Set these explicitly so the OAuth callback
            # URL is built from the public host, not from N8N_PORT (avoids :5678).
            # N8N_WEBHOOK_URL replaces the deprecated WEBHOOK_URL and sets the base URL of both
            # production and test webhooks (UrlService.getWebhookBaseUrl/getTestWebhookBaseUrl, #342).
            - name: N8N_WEBHOOK_URL
              value: "https://n8n.furchert.ch/"
            - name: N8N_EDITOR_BASE_URL
              value: "https://n8n.furchert.ch/"
            - name: N8N_PROXY_HOPS
              value: "1"
            - name: N8N_SSO_MANAGED_BY_ENV
              value: "true"
            - name: N8N_SSO_OIDC_LOGIN_ENABLED
              value: "true"
            - name: N8N_SSO_OIDC_CLIENT_ID
              value: "n8n"
            - name: N8N_SSO_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: homelab-auth-secrets
                  key: n8n-client-secret
            - name: N8N_SSO_OIDC_DISCOVERY_ENDPOINT
              value: "https://auth.furchert.ch/.well-known/openid-configuration"
            # Telemetry off (default true).
            - name: N8N_DIAGNOSTICS_ENABLED
              value: "false"
            # Pinned to the 2.46.4 defaults, which the startup log flags as changing in a future
            # version (owner decision 2026-11-07, #342; see DEPLOYMENT.md "n8n → Pinned defaults").
            - name: N8N_UNVERIFIED_PACKAGES_ENABLED
              value: "true"
            - name: N8N_RUNNERS_MODE
              value: "internal"
            - name: N8N_RUNNERS_TASK_TIMEOUT # seconds
              value: "300"
            - name: N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES # 2 GiB
              value: "2147483648"
            - name: N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES
              value: "5000"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5678
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5678
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # startupProbe budget ≈ 10 min: the 727 MB SQLite DB must run ~15 migrations on
          # first boot of 2.36.8; liveness must not kill the pod mid-migration.
          startupProbe:
            httpGet:
              path: /healthz
              port: 5678
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 59
          volumeMounts:
            - name: n8n-data
              mountPath: /home/node/.n8n
          resources:
            requests:
              cpu: 100m
              # Raised 256Mi -> 768Mi (2026-09-03): measured working set ~450-590 MiB, so the pod ran
              # far above its request and was the first eviction candidate under node pressure. #74
              memory: 768Mi
            limits:
              cpu: 1000m
              # Raised 1Gi -> 2Gi (2026-09-03): OOMKilled twice loading the n8n-backup workflow's
              # execution data (baseline ~450-590 MiB, spike past 1Gi within one 15 s scrape). #72
              memory: 2Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
      volumes:
        - name: n8n-data
          persistentVolumeClaim:
            claimName: n8n-data
