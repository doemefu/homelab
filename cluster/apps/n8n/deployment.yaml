apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: apps
  labels:
    app: n8n
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: n8n
          # Pinned 2.36.8 (2026-08-28; 2.37.x is beta). Node 24.18.1 / Alpine 3.24, multi-arch
          # amd64+arm64 (Docker Hub manifest). ~13–15 SQLite migrations since 2.17.1 (additive
          # except two Drop* on unrelated feature tables), forward-only: PVC backup before rollout
          # (DEPLOYMENT.md).
          image: n8nio/n8n:2.36.8
          ports:
            - containerPort: 5678
          env:
            - name: N8N_PORT
              value: "5678"
            - name: GENERIC_TIMEZONE
              value: "Europe/Zurich"
            - name: TZ
              value: "Europe/Zurich"
            - name: N8N_BASIC_AUTH_ACTIVE
              value: "false"
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: n8n-secrets
                  key: encryption-key
            - name: N8N_HOST
              value: "n8n.furchert.ch"
            - name: N8N_PROTOCOL
              value: "https"
            # Behind the Cloudflare Tunnel + Traefik, n8n is reached on the
            # standard HTTPS port. Set these explicitly so the OAuth callback
            # URL is built from the public host, not from N8N_PORT (avoids :5678).
            - name: WEBHOOK_URL
              value: "https://n8n.furchert.ch/"
            - name: N8N_EDITOR_BASE_URL
              value: "https://n8n.furchert.ch/"
            - name: N8N_PROXY_HOPS
              value: "1"
            - name: N8N_SSO_MANAGED_BY_ENV
              value: "true"
            - name: N8N_SSO_OIDC_LOGIN_ENABLED
              value: "true"
            - name: N8N_SSO_OIDC_CLIENT_ID
              value: "n8n"
            - name: N8N_SSO_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: homelab-auth-secrets
                  key: n8n-client-secret
            - name: N8N_SSO_OIDC_DISCOVERY_ENDPOINT
              value: "https://auth.furchert.ch/.well-known/openid-configuration"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5678
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5678
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # startupProbe budget ≈ 10 min: the 727 MB SQLite DB must run ~15 migrations on
          # first boot of 2.36.8; liveness must not kill the pod mid-migration.
          startupProbe:
            httpGet:
              path: /healthz
              port: 5678
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 59
          volumeMounts:
            - name: n8n-data
              mountPath: /home/node/.n8n
          resources:
            requests:
              cpu: 100m
              # Raised 256Mi -> 768Mi (2026-09-03): measured working set ~450-590 MiB, so the pod ran
              # far above its request and was the first eviction candidate under node pressure. #74
              memory: 768Mi
            limits:
              cpu: 1000m
              # Raised 1Gi -> 2Gi (2026-09-03): OOMKilled twice loading the n8n-backup workflow's
              # execution data (baseline ~450-590 MiB, spike past 1Gi within one 15 s scrape). #72
              memory: 2Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
      volumes:
        - name: n8n-data
          persistentVolumeClaim:
            claimName: n8n-data
