# Ingress hardening (P2, optional): the MCP port is reachable only from cloudflared, the metrics/health port only from
# Prometheus. There is no default-deny in `apps`; this policy only restricts club-mcp's own pods. No egress rules.
# LIMIT: Kubernetes always admits traffic from the pod's own node (kubelet probes rely on it); same limit as
# cluster/monitoring/coroot-node-agent/networkpolicy.yaml. Broader NetworkPolicy coverage: homelab#127.
# The cloudflared selector (chart cloudflare-tunnel-remote 0.1.2) is NOT verified on the cluster yet: check
# `kubectl -n platform get pods --show-labels` before the first playbook-55 run (DEPLOYMENT.md "club-mcp").
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: club-mcp
  namespace: apps
  labels:
    app: club-mcp
spec:
  podSelector:
    matchLabels:
      app: club-mcp
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudflare-tunnel-remote
      ports:
        - protocol: TCP
          port: 8083
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              operator.prometheus.io/name: kube-prometheus-stack-prometheus
      ports:
        - protocol: TCP
          port: 8084
