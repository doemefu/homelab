apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: club-mcp
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
  namespaceSelector:
    matchNames:
      - apps
  selector:
    matchLabels:
      app: club-mcp
