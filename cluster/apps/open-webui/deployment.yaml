apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: apps
  labels:
    app: open-webui
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: open-webui
          # Pinned version: v0.11.1 (released 2026-08-25, verified 2026-08-28 via the GHCR
          # anonymous-token API against ghcr.io/v2/open-webui/open-webui/manifests/v0.11.1,
          # index digest sha256:6bb1fbe8ab0a3e0456067f493044ffb66a30a65a34be47f6a5862176a370dd16):
          #   manifest list contains linux/amd64
          #   (sha256:e3a36f3aefb2408ac01d8aa2bba24f75d2569ffb6de6e7d2865c0045a38592ac) and
          #   linux/arm64 (sha256:1a9e26d236d5e02440a22c3c024a7fc865601ae28c2d6277c6b9e4ced64f7902)
          #   image manifests for this exact tag.
          # v0.11.0/v0.11.1 are security-fix releases (XSS, authz bypass in knowledge search,
          # SSRF filter bypass, ReDoS, session revocation) — see research 2026-08-28. Image
          # still runs as UID 0 (Dockerfile ARG UID=0) — the SECURITY DEVIATION block below
          # remains valid.
          #
          # ┌─────────────────────────────────────────────────────────────────────────┐
          # │  SECURITY DEVIATION — CONTAINER RUNS AS ROOT (UID 0)                   │
          # │                                                                         │
          # │  Platform convention: runAsNonRoot:true + runAsUser/Group:1000.        │
          # │  This cannot be applied here. The official pre-built GHCR image is     │
          # │  built with Dockerfile ARGs UID=0 / GID=0 (the upstream defaults).     │
          # │  The published image therefore runs as UID 0 (root). Setting            │
          # │  runAsNonRoot:true causes Kubernetes to reject the pod at admission.   │
          # │                                                                         │
          # │  Mitigation in place: allowPrivilegeEscalation:false (prevents         │
          # │  setuid/capability escalation even from a root process).               │
          # │                                                                         │
          # │  Path to full compliance: open-webui supports non-root operation via   │
          # │  build args (UID/GID). A custom image build (--build-arg UID=1000      │
          # │  --build-arg GID=1000) would allow runAsNonRoot:true. Track this in   │
          # │  docs/02 §11 (decision log) before Phase 1 close (AC-0.x pending).    │
          # │  Monitor upstream for a future release that ships non-root by default. │
          # └─────────────────────────────────────────────────────────────────────────┘
          image: ghcr.io/open-webui/open-webui:v0.11.1
          ports:
            - containerPort: 8080
          env:
            - name: TZ
              value: "Europe/Zurich"
            - name: WEBUI_URL
              value: "https://club.furchert.ch"
            # SAFE-BY-DEFAULT: signup disabled. For the very first login (0b),
            # temporarily set "true", log in, immediately revert to "false" and
            # re-apply BEFORE the Cloudflare route to club.furchert.ch is
            # added — this ordering is mandatory (security review 2026-07-06:
            # public open-registration window otherwise).
            - name: ENABLE_SIGNUP
              value: "false"
            # Env is the single source of truth: without this, Open WebUI persists
            # connection settings (incl. the API key as first seen — then a placeholder)
            # into its DB on first boot and ignores later env changes (PersistentConfig).
            - name: ENABLE_PERSISTENT_CONFIG
              value: "false"
            - name: ENABLE_OPENAI_API
              value: "true"
            # Use the OpenAI-compatible endpoint (LiteLLM) for RAG embeddings instead
            # of loading a local sentence-transformers model — saves ~1Gi RAM at boot
            # (1Gi limit was OOMKilled on first boot 2026-07-06) and keeps embedding
            # traffic on the club-embed alias (D5/D14).
            - name: RAG_EMBEDDING_ENGINE
              value: "openai"
            - name: RAG_EMBEDDING_MODEL
              value: "club-embed"
            - name: OPENAI_API_BASE_URL
              value: "http://litellm.apps.svc.cluster.local:4000/v1"
            - name: OPENAI_API_KEY
              # secret created in Phase 0b via 59_app_services pattern (playbook
              # 54_club_assistant.yml); the pipe-to-n8n function arrives in Phase 3
              valueFrom:
                secretKeyRef:
                  name: club-assistant-secrets
                  key: LITELLM_CLUB_KEY
          # Known regressions on v0.11.0/v0.11.1 (unfixed in any released tag, 2026-08-28): toggling a model's
          # enable/disable switch in Admin > Models permanently deletes it (open-webui#29036 et al.) — manage models
          # in LiteLLM instead; Workspace > Knowledge page hangs (open-webui#29104) — use chat/REST for RAG checks.
          livenessProbe:
            # /health is the confirmed liveness endpoint; returns {"status": true}
            # Evidence: @app.get('/health') in backend/open_webui/main.py
            # /ready also exists as a deeper readiness check (DB + Redis); /health
            # is preferred for liveness since it is always fast and stateless.
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            # first boot initializes the SQLite DB and may pull models/assets;
            # allow ~5 min before the kubelet declares failure (310 s is enough: 10 alembic
            # migrations on an 872 KB SQLite DB; n8n/LiteLLM got 600 s for much larger migrations)
            failureThreshold: 30
          volumeMounts:
            - name: open-webui-data
              mountPath: /app/backend/data
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              # 1Gi OOMKilled during first boot (local embedding model load,
              # 2026-07-06); 2Gi is within the platform's amd64 heavy-workload
              # ceiling (APP-DEPLOYMENT.md)
              memory: 2Gi
          securityContext:
            # runAsNonRoot / runAsUser 1000 NOT set — see SECURITY DEVIATION above.
            # Container runs as UID 0 by default (upstream published image).
            allowPrivilegeEscalation: false
            # Verified live 2026-07-07 (Phase 0c): pod boots and serves with ALL
            # capabilities dropped (PVC already initialized; no CAP_CHOWN needed).
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: open-webui-data
          persistentVolumeClaim:
            claimName: open-webui-data
