apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: apps
  labels:
    app: litellm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      enableServiceLinks: false
      # Non-root (runAsUser 1000) removed 2026-07-06: the upstream litellm-database
      # image is not non-root-capable — prisma's query engine fails with
      # NotConnectedError even with a writable HOME, and no non_root variant exists
      # for 1.83.x (registry checked). This restores the posture the working 68-day
      # deployment always had. Retry when upstream ships a non_root -database image.
      containers:
        - name: litellm
          # Pinned stable patch version — avoid 1.82.7 and 1.82.8 (malicious releases).
          # The -database variant auto-migrates Postgres schema on startup.
          # Pinned v1.98.0 (2026-08-23). No '-stable' suffix since v1.84.0 (weekly releases bump MINOR).
          # Fixes CVE-2026-49468 (critical host-header auth bypass) + 4 further advisories since 1.83.7.
          # Multi-arch: linux/amd64 + linux/arm64. Index digest:
          # sha256:5ead13edd4efd89f32dab349c1f19447d395affca53f3aeae00f5e6e01b8c08d
          image: docker.litellm.ai/berriai/litellm-database:v1.98.0
          args:
            - "--config"
            - "/app/proxy_config.yaml"
            - "--port"
            - "4000"
          ports:
            - containerPort: 4000
          env:
            - name: LITELLM_DROP_PARAMS
              value: "true"
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: LITELLM_MASTER_KEY
            - name: LITELLM_SALT_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: LITELLM_SALT_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: DATABASE_URL
            - name: MISTRAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: MISTRAL_API_KEY
            - name: MISTRAL_CODESTRAL_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: MISTRAL_CODESTRAL_KEY
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: GEMINI_API_KEY
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: ANTHROPIC_API_KEY
            - name: MISTRAL_VIBE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: MISTRAL_VIBE_API_KEY
            # Required for non-root (runAsUser 1000): prisma writes its binary cache
            # to $HOME/.cache; without HOME it resolves to '/' (not writable) and the
            # pod crashloops on "prisma migrate deploy" (observed 2026-07-06; same
            # failure as the 7-day-old stale RS — the v1.83.7+non-root spec had never
            # successfully rolled out).
            - name: HOME
              value: "/tmp"
            - name: GENERIC_TIMEZONE
              value: "Europe/Zurich"
            - name: TZ
              value: "Europe/Zurich"
            - name: LITELLM_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: LITELLM_OIDC_CLIENT_SECRET
            # LiteLLM reads SSO config exclusively from env vars (os.getenv), not from general_settings.
            - name: GENERIC_CLIENT_ID
              value: "litellm"
            - name: GENERIC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: LITELLM_OIDC_CLIENT_SECRET
            - name: GENERIC_AUTHORIZATION_ENDPOINT
              value: "https://auth.furchert.ch/oauth2/authorize"
            - name: GENERIC_TOKEN_ENDPOINT
              value: "https://auth.furchert.ch/oauth2/token"
            - name: GENERIC_USERINFO_ENDPOINT
              value: "https://auth.furchert.ch/userinfo"
            # Required so the SSO callback redirect_uri is https://ai.furchert.ch/sso/callback,
            # not the internal cluster IP that LiteLLM would otherwise derive from request.base_url.
            - name: PROXY_BASE_URL
              value: "https://ai.furchert.ch"
            # auth-service has requireProofKey(true) globally — all clients must use PKCE.
            - name: GENERIC_CLIENT_USE_PKCE
              value: "true"
          # ConfigMap mounted as a file — ordering: ConfigMap must exist before Deployment is applied.
          volumeMounts:
            - name: config-volume
              mountPath: /app/proxy_config.yaml
              subPath: config.yaml
              readOnly: true
          # startupProbe budget: 20 s initial delay + 58 × 10 s ≈ 10 min — covers the Prisma migration
          # jump 1.83.7 → 1.98.0 (~15 minor versions); matches the 600 s wait in 53_litellm.yml. A
          # kubelet kill mid-migration can leave _prisma_migrations inconsistent (P3009).
          startupProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            failureThreshold: 58
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 0
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            initialDelaySeconds: 0
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: config-volume
          configMap:
            name: litellm-config
