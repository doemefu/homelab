apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: apps
  labels:
    app: litellm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      enableServiceLinks: false
      # Non-root restored 2026-08-29: upstream fixed the prisma-engine NotConnectedError
      # across v1.94.0/v1.95.0/v1.97.0
      # (engines baked at a fixed, world-readable /opt/prisma path, HOME=/app baked in and writable, USER 65534).
      # litellm-non_root bundles the same Prisma/Postgres support as litellm-database (no separate -database-non_root image exists).
      # Verified 2026-08-29 by a pull test on the cluster: uid=65534(nobody), HOME=/app writable — research-litellm.md §B.
      containers:
        - name: litellm
          # Avoid 1.82.7 and 1.82.8 (malicious releases on PyPI, March 2026).
          # The non_root image auto-migrates the Postgres schema on startup (prisma migrate deploy).
          # Pinned v1.98.0 (2026-08-23). No '-stable' suffix since v1.84.0 (weekly releases bump MINOR).
          # Fixes CVE-2026-49468 (critical host-header auth bypass) + 4 further advisories since 1.83.7.
          # Multi-arch: linux/amd64 + linux/arm64. Digest prefix confirmed by cluster pull test:
          # sha256:157aaf0a519713663ec6abefe73fa48bf12f638b...
          image: docker.litellm.ai/berriai/litellm-non_root:v1.98.0
          args:
            - "--config"
            - "/app/proxy_config.yaml"
            - "--port"
            - "4000"
          ports:
            - containerPort: 4000
          env:
            - name: LITELLM_DROP_PARAMS
              value: "true"
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: LITELLM_MASTER_KEY
            - name: LITELLM_SALT_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: LITELLM_SALT_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: DATABASE_URL
            - name: MISTRAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: MISTRAL_API_KEY
            - name: MISTRAL_CODESTRAL_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: MISTRAL_CODESTRAL_KEY
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: GEMINI_API_KEY
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: ANTHROPIC_API_KEY
            - name: MISTRAL_VIBE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: MISTRAL_VIBE_API_KEY
            - name: GENERIC_TIMEZONE
              value: "Europe/Zurich"
            - name: TZ
              value: "Europe/Zurich"
            - name: LITELLM_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: LITELLM_OIDC_CLIENT_SECRET
            # LiteLLM reads SSO config exclusively from env vars (os.getenv), not from general_settings.
            - name: GENERIC_CLIENT_ID
              value: "litellm"
            - name: GENERIC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: LITELLM_OIDC_CLIENT_SECRET
            - name: GENERIC_AUTHORIZATION_ENDPOINT
              value: "https://auth.furchert.ch/oauth2/authorize"
            - name: GENERIC_TOKEN_ENDPOINT
              value: "https://auth.furchert.ch/oauth2/token"
            - name: GENERIC_USERINFO_ENDPOINT
              value: "https://auth.furchert.ch/userinfo"
            # Required so the SSO callback redirect_uri is https://ai.furchert.ch/sso/callback,
            # not the internal cluster IP that LiteLLM would otherwise derive from request.base_url.
            - name: PROXY_BASE_URL
              value: "https://ai.furchert.ch"
            # auth-service has requireProofKey(true) globally — all clients must use PKCE.
            - name: GENERIC_CLIENT_USE_PKCE
              value: "true"
          # ConfigMap mounted as a file — ordering: ConfigMap must exist before Deployment is applied.
          volumeMounts:
            - name: config-volume
              mountPath: /app/proxy_config.yaml
              subPath: config.yaml
              readOnly: true
          # startupProbe budget: 20 s initial delay + 58 × 10 s ≈ 10 min — covers the Prisma migration
          # jump 1.83.7 → 1.98.0 (~15 minor versions). Roll out with 'kubectl -n apps rollout status
          # deploy/litellm --timeout=10m' — the playbook's availableReplicas wait does not gate on the
          # new pod under the default RollingUpdate strategy. A kubelet kill mid-migration can leave
          # the Prisma migration state inconsistent.
          startupProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            failureThreshold: 58
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 0
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            initialDelaySeconds: 0
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
      volumes:
        - name: config-volume
          configMap:
            name: litellm-config
