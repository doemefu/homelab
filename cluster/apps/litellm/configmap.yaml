apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: apps
data:
  config.yaml: |
    model_list:
      - model_name: mistral-large
        litellm_params:
          model: mistral/mistral-large-latest
          api_key: os.environ/MISTRAL_API_KEY

      - model_name: mistral-small
        litellm_params:
          model: mistral/mistral-small-latest
          api_key: os.environ/MISTRAL_API_KEY

      - model_name: mistral-devstral
        litellm_params:
          model: mistral/devstral-latest
          api_key: os.environ/MISTRAL_API_KEY

      - model_name: mistral-magistral
        litellm_params:
          model: mistral/magistral-medium-latest
          api_key: os.environ/MISTRAL_API_KEY

      - model_name: mistral-codestral
        litellm_params:
          model: mistral/codestral-latest
          api_key: os.environ/MISTRAL_CODESTRAL_KEY

      # ---- Club Assistant routes (D3/D14, docs/02 §6) ----
      # See club_assist/k8s/litellm-values/config-additions.yaml for full evidence/rationale.
      # Provider routes: max_budget here is a BACKSTOP only — the club-* aliases below
      # carry the primary, tighter per-alias budgets for normal traffic.
      # M4 Q4 review (2026-10-06, D-M4, OD-4 = O-H2; club_assist worklog 20261006-001500-m4-model-routing-q4-18db): both provider routes follow the Gemini
      # lineup. gemini-flash -> Gemini 3.8 Flash. gemini-pro -> gemini-3.1-pro-preview, a PREVIEW model that Google can
      # withdraw (gemini-3-pro-preview already carried a past deprecation_date). Fallback if it is withdrawn:
      # gemini/gemini-3.8-flash (or gemini/gemini-2.5-pro while it is still served). RULE: no club-* alias may target
      # gemini-pro or any preview model. Re-check the Gemini deprecations page monthly; the quarterly model review
      # re-verifies this route.
      - model_name: gemini-flash
        litellm_params:
          model: gemini/gemini-3.8-flash
          api_key: os.environ/GEMINI_API_KEY
          max_budget: 5
          budget_duration: 30d

      - model_name: gemini-pro
        litellm_params:
          model: gemini/gemini-3.1-pro-preview
          api_key: os.environ/GEMINI_API_KEY
          max_budget: 5
          budget_duration: 30d

      # Anthropic parked for now (D21, 2026-07-06): claude-sonnet route removed;
      # club-complex runs on Mistral Large (largest contingent). Re-enable by adding
      # an anthropic/... route here — the ANTHROPIC_API_KEY env plumbing stays in place
      # (SOPS placeholder).

      # Task-class aliases (docs/02 §6 routing table; prompt designs reference these
      # model_name values as their LiteLLM target — never a bare provider model string).
      # Quality-first upgrade (2026-08-22, Dominic's call): stage-1 classification moves
      # off mistral-small onto the pinned flagship until a later Anthropic switch. Also
      # retires the last club-* `-latest` reference (G2). Budget raised 1.5 -> 10 for the
      # Drive-corpus classification seed (~3,724 docs); L8 red-team suites re-run after.
      - model_name: club-classify
        litellm_params:
          model: mistral/mistral-large-2512
          api_key: os.environ/MISTRAL_API_KEY
          max_budget: 10
          budget_duration: 30d

      # Repointed off -latest to a dated snapshot (security finding G2,
      # docs/04 Phase-2 task 2, club_assist worklog 20260711-114552):
      # club-extract must not silently drift under a provider-managed alias.
      - model_name: club-extract
        litellm_params:
          model: mistral/mistral-large-2512
          api_key: os.environ/MISTRAL_API_KEY
          max_budget: 12
          budget_duration: 30d

      # D40 standing remediation (club_assist worklog 20260711-114552): the
      # OCR backfill (468 PDFs, $0.91) proved out mistral-ocr; this route is
      # for the future recurring OCR drain, which calls LiteLLM's native
      # /v1/ocr endpoint (BerriAI/litellm PR #15571, in this deployment's
      # v1.98.0) with a scoped virtual key — never the
      # provider master key. Dated snapshot per G2 (no -latest).
      - model_name: club-ocr
        litellm_params:
          model: mistral/mistral-ocr-4-1
          api_key: os.environ/MISTRAL_API_KEY
          max_budget: 2
          budget_duration: 30d

      # M4 (2026-10-06, D-M4; club_assist worklog 20261006-001500-m4-model-routing-q4-18db), TEMPORARY budget raise (F3): one Evaluate-all is 60 rows
      # (45 scenario + 15 ladder). club-draft carries the v1.1 baseline AND the v1.2 A/B arm A in one 30d window
      # (about 25 USD); club-draft-long carries arm B and the drafting gate. Restored to 5 / 3 in the club-draft
      # 3.8 Flash commit, when the A/B is over.
      - model_name: club-draft
        litellm_params:
          model: gemini/gemini-3.5-flash
          api_key: os.environ/GEMINI_API_KEY
          max_budget: 35  # temporary, was 5
          budget_duration: 30d

      # M4 Q4 review (2026-10-06, D-M4; club_assist worklog 20261006-001500-m4-model-routing-q4-18db):
      # club-draft-long leaves gemini-2.5-pro (Pro tier retired) for Gemini 3.8 Flash (GA, 1,048,576 ctx,
      # 65,536 out; intro price $0.75/$3.75 per Mtok until 2026-12-31, then $1.50/$7.50).
      - model_name: club-draft-long
        litellm_params:
          model: gemini/gemini-3.8-flash
          api_key: os.environ/GEMINI_API_KEY
          max_budget: 11  # temporary, was 3
          budget_duration: 30d

      # D21 (2026-07-06): complex reasoning on Mistral 3.5 ("Vibe" — Mistral's most
      # capable model, Dominic's call) while Anthropic is parked. Pinned dated ID
      # mistral-medium-3-5 (= mistral-medium-latest today; 262k ctx, $1.5/$7.5 per M).
      - model_name: club-complex
        litellm_params:
          model: mistral/mistral-medium-3-5
          api_key: os.environ/MISTRAL_VIBE_API_KEY
          max_budget: 15
          budget_duration: 30d

      # D48 (2026-08-25, Phase 3): sparring chat on Claude Sonnet 5 via LiteLLM (first Anthropic route since D21).
      # Exact model id (no dated snapshot exists for the Claude 5 family; re-verify at the quarterly model review).
      # Prompt caching: cache_control injected on the system message (static sparring prompt, D32 byte-stable).
      # Sonnet 5 rejects sampling parameters (400 "temperature is deprecated for this model", observed live
      # 2026-08-25 on the first chat turn); the global LITELLM_DROP_PARAMS only drops provider-unsupported keys,
      # so the route drops them explicitly — clients (the n8n OpenAI Chat Model node) may still send them.
      # M4 Q4 review (2026-10-06, D-M4; club_assist worklog 20261006-001500-m4-model-routing-q4-18db): Sonnet 5 -> Sonnet 5.5 (same price, $2/$10 per Mtok).
      # Sonnet 5.5 also rejects `thinking: disabled`, non-default sampling parameters and forced `tool_choice`;
      # keep additional_drop_params below. `reasoning_effort` stays UNSET (OD-5; never `none` on this model);
      # tuning knob only if truncation shows in the AC-3.2 / RT-C runs.
      - model_name: club-sparring
        litellm_params:
          model: anthropic/claude-sonnet-5-5
          api_key: os.environ/ANTHROPIC_API_KEY
          max_budget: 15
          budget_duration: 30d
          additional_drop_params: ["temperature", "top_p"]
          cache_control_injection_points:
            - location: message
              role: system

      # M4b (2026-10-13, D58; club_assist worklog 20261013-114037-m4b-opus-judge-3d8e): LLM judge for the
      # m8_eval_drafting Evaluation only (task class `judge`; m2_llm_call refuses it for any other caller and
      # refuses this alias for any other task class). Opus 5.5 rejects sampling params, forced tool_choice and
      # disabled thinking. Pricing sits in litellm_params (LiteLLM custom pricing; never 0 — a zero price waives
      # budget checks) and the capability flags in model_info, so cost tracking never depends on the remote price
      # map and json_schema never turns into a forced tool call (400) when that map, fetched at pod start,
      # misses the model (C0 probes, 2026-10-13). Residual: on such a miss a configured reasoning_effort is
      # silently dropped (model default medium) — the post-restart map check in the M4b snippets catches it.
      # reasoning_effort per the M4b spike rule OD-4 (unset = model default medium; never `none`, never xhigh).
      - model_name: club-judge
        litellm_params:
          model: anthropic/claude-opus-5-5
          api_key: os.environ/ANTHROPIC_API_KEY
          max_budget: 10
          budget_duration: 30d
          additional_drop_params: ["temperature", "top_p"]
          input_cost_per_token: 0.000004
          output_cost_per_token: 0.00002
          # reasoning_effort: high
        model_info:
          supports_native_structured_output: true
          supports_output_config: true
          supports_adaptive_thinking: true
          supports_reasoning: true
          thinking_always_on: true
          supports_sampling_params: false

      # placeholder until D5 embedding freeze in Phase 1; dimension 1024 (mistral-embed) —
      # NOTE: sql/*.sql migrations currently assume vector(1536); reconcile at D5.
      - model_name: club-embed
        litellm_params:
          model: mistral/mistral-embed
          api_key: os.environ/MISTRAL_API_KEY
          max_budget: 3
          budget_duration: 30d

      # Placeholder — uncomment when Ollama is deployed on MacBook Air node
      # - model_name: ollama/llama3
      #   litellm_params:
      #     model: ollama/llama3
      #     api_base: http://ollama.apps.svc.cluster.local:11434

    general_settings:
      # os.environ/ syntax: LiteLLM reads value from env var at runtime.
      # The literal key values must NEVER appear here — they live in litellm-secrets only.
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: os.environ/DATABASE_URL
      store_model_in_db: true   # intentionally true to allow dashboard-managed model config
      default_user_params:
        user_role: admin
