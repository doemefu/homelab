# Helm-chart version tracking manifest — DO NOT INSTALL, DO NOT RENDER.
#
# Purpose
# -------
# Our cluster's Helm chart versions are pinned inline inside Ansible
# playbooks (`infra/playbooks/*.yml`, look for `chart_version:`). That is
# where the cluster reads them from. This file exists *solely* to give a
# freshness checker something to scan; it is a tracking artifact, not a
# real Helm chart.
#
# How it works (as of 2026-09-04 — see #62)
# ------------------------------------------
# 1. `.github/workflows/helm-chart-freshness.yml` runs weekly (and on
#    manual `workflow_dispatch`), reading the `dependencies:` list below
#    and comparing each `version:` against that chart's live `index.yaml`
#    at `repository:` (via `scripts/check-helm-chart-versions.py`).
# 2. If any chart is behind, the workflow opens (or updates) a single
#    GitHub issue titled "Helm chart versions behind upstream
#    (automated)" listing the outdated charts. It never edits this file
#    or any playbook itself.
# 3. You — the human handling that issue — bump the `version:` field for
#    that dependency *in this file*, then copy the same new version into
#    the corresponding `chart_version: "..."` line in the relevant
#    playbook under `infra/playbooks/` (see mapping in the comment on
#    each entry below), in the same PR.
# 4. Skim the chart's upstream release notes for breaking changes before
#    merging, especially for charts shipping CRDs (cert-manager,
#    kube-prometheus-stack, longhorn) — see CONTRIBUTING.md "Helm Chart
#    Version Tracking" for the full checklist.
# 5. The next `ansible-playbook ... -l <node>` run picks up the new
#    chart version. This file does **not** drive any install — Helm
#    never sees it.
#
# Why not Dependabot's own `helm` ecosystem? It was configured exactly
# this way (pointed at this same file) from 2026-05-27 to 2026-09-04 and
# never opened a single PR, despite 4 of the 6 charts below having real,
# substantial upstream updates available the whole time — a correctly
# formed, reachable config that silently never worked, for reasons not
# diagnosable without Dependabot job-log access (not exposed via the
# GitHub API). See `.github/dependabot.yml`'s comment block for the full
# investigation. The scheduled workflow above replaces it with something
# independently testable via `workflow_dispatch`.
#
# Why not just put the versions in the playbook and let a bot read them
# directly there? Renovate can do that with `customManagers`, but we'd be
# adding a second bot just for one file pattern; the umbrella-chart +
# small custom workflow keeps everything on tooling already in this repo.
#
# Why this file lives under `.github/` rather than `cluster/`
# -----------------------------------------------------------
# - It is bot metadata, not deployable infrastructure.
# - `cluster/` is rendered by `kustomize build`, validated by
#   `kubeconform`, and policy-checked by `conftest`. Keeping the
#   tracking chart out of that tree means none of those tools have to
#   special-case it.
# - Co-locating with `.github/dependabot.yml` makes the relationship
#   between the two files obvious to future maintainers.
#
# Maintenance
# -----------
# - When a new chart is adopted in a playbook, add a matching entry
#   here in the same PR. When a chart is removed, delete the entry.
# - The umbrella metadata (apiVersion/name/version/appVersion) is
#   placeholder content for Dependabot's parser — do not invent
#   semantics for it.
---
apiVersion: v2
name: homelab-charts-tracked
description: |
  Version-tracking-only umbrella chart consumed by Dependabot. NEVER
  installed by Helm. See the header comment in this file for the full
  workflow.
type: application
version: 0.0.0
appVersion: "0"

dependencies:
  # Distributed block storage. Drives StorageClass `longhorn`.
  # Sync target: `infra/playbooks/30_longhorn.yml` → `chart_version:`
  - name: longhorn
    version: "1.7.2"
    repository: "https://charts.longhorn.io"

  # TLS issuance (Let's Encrypt).
  # Sync target: `infra/playbooks/40_platform.yml` → `chart_version:` (cert-manager)
  - name: cert-manager
    version: "v1.17.1"
    repository: "https://charts.jetstack.io"

  # Outbound tunnel to Cloudflare; only ingress path from the public internet.
  # Sync target: `infra/playbooks/40_platform.yml` → `chart_version:` (cloudflare-tunnel-remote)
  - name: cloudflare-tunnel-remote
    version: "0.1.2"
    repository: "https://cloudflare.github.io/helm-charts"

  # Prometheus + Alertmanager + Grafana bundle.
  # Sync target: `infra/playbooks/41_monitoring.yml` → `chart_version:`
  - name: kube-prometheus-stack
    version: "69.3.1"
    repository: "https://prometheus-community.github.io/helm-charts"

  # Time-series DB for device-service metrics.
  # Sync target: `infra/playbooks/50_apps_infra.yml` → `chart_version:` (influxdb2)
  - name: influxdb2
    version: "2.1.2"
    repository: "https://helm.influxdata.com/"

  # Home Assistant (Docker on mba1 — chart kept tracked in case we migrate to k3s).
  # Sync target: `infra/playbooks/51_homeassistant.yml` → `chart_version:`
  - name: home-assistant
    version: "0.3.51"
    # pajikos.github.io 301-redirects index.yaml to this host; point directly
    # at the redirect target so Dependabot never relies on redirect handling.
    repository: "https://blog.pavelsklenar.com/home-assistant-helm-chart/"
