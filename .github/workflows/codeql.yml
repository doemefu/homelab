name: "CodeQL"

# Supply-chain hardening (#37): every third-party `uses:` here is SHA-pinned
# with a `# vX.Y.Z` comment and `actions/checkout` sets
# `persist-credentials: false` — see `ci.yml` in this same directory for the
# full convention and the re-pinning procedure (both files follow it).

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  analyze:
    # Display name kept stable as "CodeQL" — referenced by
    # .github/rulesets/main-branch.json as a required status check.
    # Do not rename without updating the ruleset.
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: actions
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:actions"
