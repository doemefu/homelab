name: CI

# Supply-chain hardening (#37): every third-party `uses:` is pinned to a full
# commit SHA (not a mutable tag) with a `# vX.Y.Z` comment recording which
# release that SHA corresponds to at pin time; every `actions/checkout` step
# sets `persist-credentials: false` since none of these jobs push anything
# (workflow already runs with `permissions: contents: read`, so this is
# defense-in-depth, not a fix for an active gap); every binary downloaded via
# `curl | tar` is checksum-verified against the upstream release's own
# published checksums before extraction (all binary steps assume the
# `ubuntu-latest` runner's linux/amd64 architecture, matching every asset
# filename below — e.g. `_linux_amd64`/`-linux-amd64`). Re-pinning the 5 actions:
# `.github/dependabot.yml`'s `github-actions` ecosystem entry already tracks these and
# opens a PR with the new SHA on a version bump — review and merge that PR rather than
# hand-resolving (hand-resolving is only for sanity-checking an already-open Dependabot PR,
# or a bump outside its weekly schedule): `gh api repos/<owner>/<repo>/git/ref/tags/<tag>`
# (dereference an annotated tag via `git/tags/<sha>` -> `object.sha`). Re-pinning the 6
# curl-downloaded binaries is fully manual — Dependabot doesn't track them at all —
# just re-fetch the matching checksums for the new version (ShellCheck publishes no
# checksums file: its digest is the asset's `digest` field via `gh api`, see the
# lint-shell job). This same convention applies to
# `codeql.yml` and `helm-chart-freshness.yml` in this directory (see their header comments)
# and should be applied to any future workflow file added here.

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

permissions:
  contents: read

# Mirrors the auth-service pattern: cancels older runs on the same PR (or branch
# for non-PR pushes) without referencing untrusted head_ref content.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Fast change-area dispatcher. Every heavier job conditions on its outputs.
  # Negation patterns (`!...`) explicitly exclude SOPS-encrypted secrets and
  # the generated Flux gotk bundle so we never lint/validate them.
  # ---------------------------------------------------------------------------
  detect-changes:
    name: Detect Changed Areas
    runs-on: ubuntu-latest
    outputs:
      ansible: ${{ steps.filter.outputs.ansible }}
      cluster: ${{ steps.filter.outputs.cluster }}
      policy: ${{ steps.filter.outputs.policy }}
      promrules: ${{ steps.filter.outputs.promrules }}
      yaml: ${{ steps.filter.outputs.yaml }}
      shell: ${{ steps.filter.outputs.shell }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            ansible:
              - 'infra/**'
              - '!infra/**/*.sops.yml'
              - '!infra/**/*.sops.yaml'
            cluster:
              - 'cluster/**'
              - '!cluster/**/*.sops.yml'
              - '!cluster/**/*.sops.yaml'
              # The kubeconform gate validates against this file's k3s_version.
              - 'infra/roles/k3s/defaults/main.yml'
              - 'scripts/validate-manifests.sh'
              - '.github/workflows/ci.yml'
            policy:
              - 'policy/**'
            promrules:
              - 'cluster/values/kube-prometheus-stack.yaml'
              - 'cluster/values/tests/**'
              - 'scripts/promtool-test-rules.sh'
              - '.github/workflows/ci.yml'
            yaml:
              - '**/*.yml'
              - '**/*.yaml'
              - '!infra/**'
              - '!**/*.sops.yml'
              - '!**/*.sops.yaml'
              - '!.sops.yaml'
              - '!cluster/flux-system/**'
            shell:
              - 'scripts/**/*.sh'
              # The ShellCheck version and checksum pins live in this file.
              - '.github/workflows/ci.yml'
            workflows:
              - '.github/workflows/**'
              - 'scripts/check-action-pins.py'

  # ---------------------------------------------------------------------------
  # Lint: cheap, fast, parallel. Each is its own status check so PR reviewers
  # see exactly what failed.
  # ---------------------------------------------------------------------------
  lint-yaml:
    name: Lint YAML
    needs: detect-changes
    if: needs.detect-changes.outputs.yaml == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install yamllint
        run: pip install "yamllint==1.35.1"
      - name: Run yamllint
        # Lint the whole repo; .yamllint's `ignore:` carves out infra/,
        # cluster/flux-system/, SOPS-encrypted files, and age keys. Keeping
        # the scope here matches what the `yaml` change filter triggers on.
        run: yamllint -c .yamllint .

  lint-shell:
    name: Lint Shell Scripts
    needs: detect-changes
    if: needs.detect-changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No third-party action involved: the ShellCheck binary is downloaded,
      # checksum-verified and executed in one step, so the verified copy is
      # exactly the one that runs (homelab-device-service#126).
      # Bump SHELLCHECK_VERSION and SHELLCHECK_SHA256 together; the digest is
      # the `digest` field of the `linux.x86_64.tar.xz` asset in
      # `gh api repos/koalaman/shellcheck/releases/tags/<version>`.
      - name: Install and run ShellCheck (pinned + checksum-verified)
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          asset="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          dir="${RUNNER_TEMP}/shellcheck"
          curl -fsSLO "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${asset}"
          echo "${SHELLCHECK_SHA256}  ${asset}" | sha256sum -c -
          mkdir -p "${dir}"
          tar -xJf "${asset}" -C "${dir}"
          rm -f "${asset}"
          "${dir}/shellcheck-${SHELLCHECK_VERSION}/shellcheck" --version
          find ./scripts -type f -name '*.sh' -print0 | xargs -0 -r "${dir}/shellcheck-${SHELLCHECK_VERSION}/shellcheck"

  lint-workflows:
    name: Lint GitHub Workflows
    needs: detect-changes
    if: needs.detect-changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint (pinned + checksum-verified)
        env:
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          set -euo pipefail
          asset="actionlint_1.7.7_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v1.7.7/${asset}"
          echo "${ACTIONLINT_SHA256}  ${asset}" | sha256sum -c -
          sudo tar -xzf "${asset}" -C /usr/local/bin actionlint
          rm -f "${asset}"
      - name: Run actionlint
        run: actionlint -color

  # ---------------------------------------------------------------------------
  # Allowlist gate for `uses:` refs (homelab-device-service#126):
  # scripts/check-action-pins.py parses every workflow file and fails on any
  # `uses` value that is not a local path, a full 40-hex commit SHA or a
  # docker:// digest. The per-repo GitHub setting `sha_pinning_required` is
  # the control enforced at run time; this job is the fast PR check.
  # ---------------------------------------------------------------------------
  check-action-pins:
    name: Check Action Pins
    needs: detect-changes
    if: needs.detect-changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install PyYAML (pinned)
        run: pip install "pyyaml==6.0.3"
      - name: Fail on any uses ref that is not pinned to a full commit SHA
        run: python3 scripts/check-action-pins.py .github/workflows

  # ---------------------------------------------------------------------------
  # Ansible lint (migrated from the standalone ansible-lint.yml workflow).
  # ---------------------------------------------------------------------------
  ansible-lint:
    name: Ansible Lint
    needs: detect-changes
    if: needs.detect-changes.outputs.ansible == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install ansible-lint and ansible-core
        run: pip install "ansible-lint==25.12.2" "ansible-core==2.20.4"
      - name: Install Ansible collections
        run: ansible-galaxy collection install -r infra/requirements.yml
      - name: Run ansible-lint
        run: ansible-lint infra/

  # ---------------------------------------------------------------------------
  # Kubernetes schema validation (scripts/validate-manifests.sh). Iterates the
  # per-app overlays plus the plain monitoring manifests
  # (cluster/monitoring/coroot-node-agent) — does NOT include
  # cluster/flux-system/ (generated gotk bundle, huge and noisy). Blocking for
  # the live Kubernetes version (k3s_version in infra/roles/k3s/defaults/main.yml);
  # report-only (warnings + job summary) for the next two minor versions (#263).
  # ---------------------------------------------------------------------------
  validate-kubernetes-manifests:
    name: Validate Kubernetes Manifests
    needs: detect-changes
    if: needs.detect-changes.outputs.cluster == 'true'
    runs-on: ubuntu-latest
    env:
      KUSTOMIZE_VERSION: v5.4.3
      KUBECONFORM_VERSION: v0.6.7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install kustomize (pinned + checksum-verified)
        env:
          KUSTOMIZE_SHA256: 3669470b454d865c8184d6bce78df05e977c9aea31c30df3c669317d43bcc7a7
        run: |
          set -euo pipefail
          asset="kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/${KUSTOMIZE_VERSION}/${asset}"
          echo "${KUSTOMIZE_SHA256}  ${asset}" | sha256sum -c -
          sudo tar -xzf "${asset}" -C /usr/local/bin kustomize
          rm -f "${asset}"
      - name: Install kubeconform (pinned + checksum-verified)
        env:
          KUBECONFORM_SHA256: 95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73
        run: |
          set -euo pipefail
          asset="kubeconform-linux-amd64.tar.gz"
          curl -fsSLO "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/${asset}"
          echo "${KUBECONFORM_SHA256}  ${asset}" | sha256sum -c -
          sudo tar -xzf "${asset}" -C /usr/local/bin kubeconform
          rm -f "${asset}"
      - name: Validate each overlay (live Kubernetes version blocking, next minors report-only)
        env:
          KUBECONFORM_CACHE: ${{ runner.temp }}/kubeconform-cache
        run: scripts/validate-manifests.sh

  # ---------------------------------------------------------------------------
  # promtool check + unit tests for the custom PrometheusRules in
  # cluster/values/kube-prometheus-stack.yaml (scripts/promtool-test-rules.sh,
  # tests in cluster/values/tests/). PROMETHEUS_VERSION follows the Prometheus
  # version that the pinned kube-prometheus-stack chart deploys (69.3.1 ->
  # v3.1.0); bump both together (#141).
  # ---------------------------------------------------------------------------
  test-prometheus-rules:
    name: Test Prometheus Rules
    needs: detect-changes
    if: needs.detect-changes.outputs.promrules == 'true'
    runs-on: ubuntu-latest
    env:
      PROMETHEUS_VERSION: 3.1.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install PyYAML (pinned)
        run: pip install "pyyaml==6.0.3"
      - name: Install promtool (pinned + checksum-verified)
        env:
          PROMETHEUS_SHA256: 9a9d1e115d1745826b13aec3f1409780b9fcf1d4206746cb4faee46ca5add70c
        run: |
          set -euo pipefail
          asset="prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          curl -fsSLO "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/${asset}"
          echo "${PROMETHEUS_SHA256}  ${asset}" | sha256sum -c -
          sudo tar -xzf "${asset}" -C /usr/local/bin --strip-components=1 \
            "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          rm -f "${asset}"
          promtool --version
      - name: Check and unit-test the rules
        run: scripts/promtool-test-rules.sh

  # ---------------------------------------------------------------------------
  # Conftest/OPA policies that encode CLAUDE.md non-negotiables. Triggered by
  # cluster/** OR policy/** changes (a policy edit must rerun its own gate).
  # ---------------------------------------------------------------------------
  enforce-cluster-policies:
    name: Enforce Cluster Policies
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.cluster == 'true' ||
      needs.detect-changes.outputs.policy == 'true'
    runs-on: ubuntu-latest
    env:
      KUSTOMIZE_VERSION: v5.4.3
      CONFTEST_VERSION: 0.56.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install kustomize (pinned + checksum-verified)
        env:
          KUSTOMIZE_SHA256: 3669470b454d865c8184d6bce78df05e977c9aea31c30df3c669317d43bcc7a7
        run: |
          set -euo pipefail
          asset="kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/${KUSTOMIZE_VERSION}/${asset}"
          echo "${KUSTOMIZE_SHA256}  ${asset}" | sha256sum -c -
          sudo tar -xzf "${asset}" -C /usr/local/bin kustomize
          rm -f "${asset}"
      - name: Install conftest (pinned + checksum-verified)
        env:
          CONFTEST_SHA256: 620f41640d63bbde1646a108ce2816ba54c980466ceebb7e754dda2d508e8cd5
        run: |
          set -euo pipefail
          asset="conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSLO "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/${asset}"
          echo "${CONFTEST_SHA256}  ${asset}" | sha256sum -c -
          sudo tar -xzf "${asset}" -C /usr/local/bin conftest
          rm -f "${asset}"
      - name: Verify policy unit tests
        # `verify` walks every *_test.rego file regardless of package, so it
        # doesn't need --all-namespaces. The per-file packages
        # (kubernetes.images / kubernetes.resources / kubernetes.namespaces /
        # kubernetes.rbac / kubernetes.securitycontext) just keep test fixtures
        # from cross-coupling — see
        # policy/kubernetes/README.md.
        run: conftest verify --policy policy/kubernetes/
      - name: Enforce policies against rendered manifests
        # Directory list: keep in sync with scripts/validate-manifests.sh.
        run: |
          set -euo pipefail
          status=0
          for d in cluster/apps/auth-service \
                   cluster/apps/device-service \
                   cluster/apps/data-service \
                   cluster/apps/mcp-hub \
                   cluster/apps/litellm \
                   cluster/apps/n8n \
                   cluster/apps/open-webui \
                   cluster/monitoring/coroot-node-agent \
                   cluster/apps; do
            echo "::group::conftest $d"
            if ! kustomize build "$d" | conftest test --policy policy/kubernetes/ --all-namespaces -; then
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

  # ---------------------------------------------------------------------------
  # Single aggregate status check — this is the only check the branch ruleset
  # requires. Passes if every dependency is success OR skipped; fails if any
  # is failure or cancelled.
  # ---------------------------------------------------------------------------
  ci-summary:
    name: CI Summary
    if: always()
    needs:
      - detect-changes
      - lint-yaml
      - lint-shell
      - lint-workflows
      - check-action-pins
      - ansible-lint
      - validate-kubernetes-manifests
      - test-prometheus-rules
      - enforce-cluster-policies
    runs-on: ubuntu-latest
    env:
      # `needs` results are controlled by GitHub Actions itself
      # (one of: success/failure/skipped/cancelled), not user input.
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - name: Fail if any required job failed or was cancelled
        run: |
          set -eu
          echo "$NEEDS_JSON" | jq .
          if echo "$NEEDS_JSON" \
             | jq -e 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled")' \
             >/dev/null; then
            echo "::error::At least one CI job failed or was cancelled."
            exit 1
          fi
          echo "All required jobs succeeded or were skipped."
